name: V10.8.49 Newcamd repair

on:
  push:
    branches:
      - repair/newcamd-v10849
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/newcamd-v10849
          fetch-depth: 0

      - name: Install build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libjsoncpp-dev libboost-system-dev libssl-dev

      - name: Apply V10.8.49 production patches
        run: |
          if grep -Fq 'kProgramVersion = "10.8.48"' src/AppVersion.h; then
            python3 scripts/apply_newcamd_v10849.py
          fi
          python3 scripts/apply_newcamd_v10849_busy_snapshot.py

      - name: Syntax check CA manager
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror=return-type \
            -Isrc -I/usr/include/jsoncpp \
            -fsyntax-only src/CaBackend.cpp

      - name: Syntax check Newcamd client
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror=return-type \
            -Isrc -Ithird_party \
            -fsyntax-only src/ca/backends/newcamd/NewcamdClient.cpp

      - name: Verify version and diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.49"' src/AppVersion.h
          git diff --name-only

      - name: Commit tested production changes when needed
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git add src/AppVersion.h src/CaBackend.cpp src/ca/backends/newcamd/NewcamdClient.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'V10.8.49 keep built-in Newcamd visible during authentication'
            git push origin HEAD:repair/newcamd-v10849
          fi
