name: Apply V10.8.158 TVStreammerSAT5 CBR

on:
  push:
    branches:
      - fix-v10.8.158-tvstreammersat5-cbr

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.158-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply transformer
        run: python3 tools/apply_v10_8_158_tvstreammersat5_cbr.py
      - name: Check diff
        run: git diff --check
      - name: Commit result
        run: |
          git config user.name "Vitali Lukomski"
          git config user.email "monkipnet@yandex.ru"
          git add src/AppVersion.h src/media/CbrTsPacer.h src/media/CbrTsPacer.cpp src/media/NativeUdpRelay.cpp
          git commit -m "V10.8.158 port TVStreammerSAT5 network CBR profile [v10.8.158-applied]"
          git push origin HEAD:fix-v10.8.158-tvstreammersat5-cbr
