name: wisi-cbr-v165

on:
  push:
    branches:
      - wisi-cbr-v165

permissions:
  contents: read

jobs:
  syntax-and-pacing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Syntax check
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_header.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_header.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: PCR-aware pacing test
        run: |
          cat >/tmp/test_wisi_cbr.cpp <<'EOF'
          #include "media/CbrTsPacer.h"
          #include <cassert>
          #include <chrono>
          #include <cstdint>
          #include <iostream>

          using namespace dvbstreamer5::media::mpegts;

          static Packet dataPacket(std::uint8_t cc) {
              Packet p{};
              p.fill(0xff);
              p[0] = kSyncByte;
              p[1] = 0x01;
              p[2] = 0x00;
              p[3] = static_cast<std::uint8_t>(0x10 | (cc & 0x0f));
              return p;
          }

          static Packet pcrPacket(std::uint64_t ticks, std::uint8_t cc) {
              Packet p = dataPacket(cc);
              p[3] = static_cast<std::uint8_t>(0x30 | (cc & 0x0f));
              p[4] = 7;
              p[5] = 0x10;
              const std::uint64_t base = ticks / 300ULL;
              const std::uint64_t ext = ticks % 300ULL;
              p[6] = static_cast<std::uint8_t>(base >> 25U);
              p[7] = static_cast<std::uint8_t>(base >> 17U);
              p[8] = static_cast<std::uint8_t>(base >> 9U);
              p[9] = static_cast<std::uint8_t>(base >> 1U);
              p[10] = static_cast<std::uint8_t>(((base & 1ULL) << 7U) | 0x7eU | ((ext >> 8U) & 1ULL));
              p[11] = static_cast<std::uint8_t>(ext & 0xffU);
              return p;
          }

          static bool isNull(const Packet& p) {
              return (((static_cast<unsigned>(p[1]) & 0x1fU) << 8U) | p[2]) == 0x1fffU;
          }

          int main() {
              constexpr std::uint64_t target = 6000000ULL;
              constexpr std::uint64_t useful = 4000000ULL;
              CbrTsPacer pacer(target);
              assert(pacer.enqueue(pcrPacket(0, 0)));
              for (unsigned i = 0; i < 99; ++i) assert(pacer.enqueue(dataPacket(static_cast<std::uint8_t>(i))));
              const std::uint64_t delta = (100ULL * 188ULL * 8ULL * 27000000ULL) / useful;
              assert(pacer.enqueue(pcrPacket(delta, 4)));
              assert(pacer.timingLocked());
              assert(pacer.sourcePayloadBitrate() > 3900000ULL);
              assert(pacer.sourcePayloadBitrate() < 4100000ULL);

              std::size_t real = 0;
              std::size_t nulls = 0;
              bool sawMixedDatagram = false;
              for (unsigned d = 0; d < 22; ++d) {
                  CbrDatagram out{};
                  const auto when = d == 0
                      ? std::chrono::steady_clock::now() + std::chrono::seconds(1)
                      : pacer.nextDeadline();
                  assert(pacer.nextDatagram(when, out));
                  unsigned dr = 0, dn = 0;
                  for (const auto& p : out) {
                      if (isNull(p)) { ++nulls; ++dn; }
                      else { ++real; ++dr; }
                  }
                  if (dr && dn) sawMixedDatagram = true;
              }
              assert(real == 101);
              assert(nulls == 53);
              assert(sawMixedDatagram);
              std::cout << "real=" << real << " null=" << nulls
                        << " source_kbps=" << pacer.sourcePayloadBitrate()/1000ULL << "\n";
              return 0;
          }
          EOF
          g++ -std=c++17 -pthread -Isrc /tmp/test_wisi_cbr.cpp src/media/CbrTsPacer.cpp -o /tmp/test_wisi_cbr
          /tmp/test_wisi_cbr
