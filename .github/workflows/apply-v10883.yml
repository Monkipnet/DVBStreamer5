name: Apply V10.8.83 feature patch

on:
  push:
    branches:
      - work/v10.8.83-adaptive-preview-playlist

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_v10883.py
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.83"' src/AppVersion.h
          grep -q 'NATIVE BROWSER PREVIEW route=' src/StreamManager.cpp
          grep -q 'openPlaylistModal()' src/HttpServer.cpp
          grep -q 'playlist-stream-checkbox' src/HttpServer.cpp
      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "DVBStreamer5 Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "V10.8.83 adaptive browser preview and VLC playlist"
          git push origin HEAD:work/v10.8.83-adaptive-preview-playlist
