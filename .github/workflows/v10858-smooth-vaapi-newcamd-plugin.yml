name: V10.8.58 integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v10858-smooth-vaapi-newcamd-plugin.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10.8.58
        shell: bash
        run: |
          cat > /tmp/apply_v10858.py <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          hw_path = Path("src/media/NativeHardwareCodec.cpp")
          hw = hw_path.read_text()
          pattern = re.compile(r"\n\s*st = vaSyncSurface\(display_, target\);\n\s*if \(st != VA_STATUS_SUCCESS\) \{\n\s*error = \"VAAPI VPP output sync failed: \" \+ std::string\(vaErrorStr\(st\)\);\n\s*return false;\n\s*\}\n")
          matches = list(pattern.finditer(hw))
          if len(matches) != 1:
              raise SystemExit(f"VAAPI VPP sync block: expected one match, got {len(matches)}")
          replacement = "\n        // Submit VPP and H.264 encode as one VAAPI dependency chain.\n        // The final encode vaSyncSurface() waits for both operations; an\n        // intermediate VPP sync serialized every scaled frame and could make\n        // legacy Intel/i965 fall below realtime during PAL-to-HD upscaling.\n"
          hw = hw[:matches[0].start()] + replacement + hw[matches[0].end():]
          hw_path.write_text(hw)

          cm_path = Path("CMakeLists.txt")
          cm = cm_path.read_text()
          json_anchor = "target_include_directories(dvbstreamer5_jsoncpp PUBLIC\n    ${CMAKE_SOURCE_DIR}/third_party\n)\n"
          cm = replace_once(cm, json_anchor, json_anchor + "set_target_properties(dvbstreamer5_jsoncpp PROPERTIES POSITION_INDEPENDENT_CODE ON)\n", "jsoncpp PIC")
          plugin_anchor = "include_directories(\n    ${CMAKE_SOURCE_DIR}/src\n)\n\n"
          plugin_lines = [
              "include_directories(",
              "    ${CMAKE_SOURCE_DIR}/src",
              ")",
              "",
              "# Newcamd is a loadable CA backend, not part of the main executable.",
              "add_library(dvbstreamer5_ca_newcamd SHARED",
              "    src/ca/backends/newcamd/NewcamdPlugin.cpp",
              "    src/ca/backends/newcamd/NewcamdClient.cpp",
              ")",
              "target_include_directories(dvbstreamer5_ca_newcamd PRIVATE",
              "    ${CMAKE_SOURCE_DIR}/src",
              "    ${CMAKE_SOURCE_DIR}/third_party",
              ")",
              "target_link_libraries(dvbstreamer5_ca_newcamd PRIVATE",
              "    dvbstreamer5_boost_headers",
              "    dvbstreamer5_jsoncpp",
              "    dvbstreamer5_dvbcsa",
              "    OpenSSL::Crypto",
              "    Threads::Threads",
              ")",
              "set_target_properties(dvbstreamer5_ca_newcamd PROPERTIES",
              "    PREFIX \"\"",
              "    OUTPUT_NAME \"dvbstreamer5-ca-newcamd\"",
              "    LIBRARY_OUTPUT_DIRECTORY \"${CMAKE_BINARY_DIR}/ca-plugins\"",
              ")",
              "",
              "",
          ]
          cm = replace_once(cm, plugin_anchor, "\n".join(plugin_lines), "Newcamd plugin target")
          builtin_sources = "    src/ca/backends/newcamd/NewcamdPlugin.cpp\n    src/ca/backends/newcamd/NewcamdClient.cpp\n"
          cm = replace_once(cm, builtin_sources, "", "remove built-in Newcamd sources")
          cm_path.write_text(cm)

          ca_path = Path("src/CaBackend.cpp")
          ca = ca_path.read_text()
          ca = replace_once(ca, '#include "ca/backends/newcamd/NewcamdBuiltin.h"\n', "", "remove Newcamd built-in include")
          builtin_ctor = "\n    if (!registerBuiltinBackendLocked(\n            dvbstreamer5_ca_backend_get_api_v1(), \"builtin:newcamd\")) {\n        std::cerr << \"Built-in Newcamd CA backend registration failed\" << std::endl;\n    }\n"
          ca = replace_once(ca, builtin_ctor, "", "remove built-in Newcamd registration")
          anchor = "        if (const auto* api = dvbstreamer5_ca_backend_get_api_v1()) {"
          start = ca.find(anchor)
          if start < 0:
              raise SystemExit("busy Newcamd block anchor not found")
          brace = ca.find("{", start)
          depth = 0
          end = None
          for i in range(brace, len(ca)):
              if ca[i] == "{":
                  depth += 1
              elif ca[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("busy Newcamd block end not found")
          while end < len(ca) and ca[end] == "\n":
              end += 1
          ca = ca[:start] + ca[end:]
          if "dvbstreamer5_ca_backend_get_api_v1()" in ca:
              raise SystemExit("direct Newcamd entry point remains in CaBackend.cpp")
          ca_path.write_text(ca)

          nb_path = Path("src/ca/backends/newcamd/NewcamdBuiltin.h")
          nb = nb_path.read_text()
          old_comment = "// The Newcamd backend is linked into DVBStreamer5.  Keeping the versioned C\n// function table lets the built-in backend and optional third-party backends\n// share the same host-side implementation without dlopen for the default path.\n"
          new_comment = "// Exported entry point of the loadable Newcamd CA backend. The host resolves\n// this symbol through dlsym using the versioned CA backend ABI.\n"
          nb = replace_once(nb, old_comment, new_comment, "Newcamd ABI header comment")
          nb_path.write_text(nb)

          ver_path = Path("src/AppVersion.h")
          ver = ver_path.read_text()
          ver = replace_once(ver, 'kProgramVersion = "10.8.57"', 'kProgramVersion = "10.8.58"', "version")
          ver_path.write_text(ver)

          cm = cm_path.read_text()
          ca = ca_path.read_text()
          hw = hw_path.read_text()
          assert "add_library(dvbstreamer5_ca_newcamd SHARED" in cm
          assert 'OUTPUT_NAME "dvbstreamer5-ca-newcamd"' in cm
          exe = cm.split("add_executable(DVBStreamer5", 1)[1].split(")", 1)[0]
          assert "NewcamdPlugin.cpp" not in exe and "NewcamdClient.cpp" not in exe
          assert "NewcamdBuiltin.h" not in ca and "builtin:newcamd" not in ca
          assert "VAAPI VPP output sync failed" not in hw
          assert 'kProgramVersion = "10.8.58"' in ver_path.read_text()
          PY
          python3 /tmp/apply_v10858.py
          rm -f .github/workflows/v10858-smooth-vaapi-newcamd-plugin.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add -A
          git status --short
          git commit -m 'V10.8.58 smooth VAAPI scaling and externalize Newcamd'
          git push origin HEAD:main
