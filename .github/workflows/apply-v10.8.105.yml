name: Apply V10.8.105 true CBR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v10.8.105.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify V10.8.105
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Monkipnet"
          git config user.email "monkipnet@yandex.ru"
          python3 -m py_compile tools/apply_v10_8_105.py
          python3 tools/apply_v10_8_105.py
          git diff --check
          grep -q 'kProgramVersion = "10.8.105"' src/AppVersion.h
          grep -q 'NATIVE OBSERVED CBR start target_kbps=' src/media/NativeUdpRelay.cpp
          ! grep -q 'relay.paceObservedTransport = false;' src/StreamManager.cpp
          git add src/AppVersion.h src/StreamManager.cpp src/media/NativeUdpRelay.cpp
          git diff --cached --check
          git commit -m "V10.8.105 true CBR for SRT HTTP HLS outputs"
          git push origin HEAD:main
