name: One-shot HttpServer module split

on:
  push:
    branches:
      - refactor-httpserver-v153

permissions:
  contents: write

jobs:
  split-httpserver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor-httpserver-v153
          fetch-depth: 0

      - name: Split HttpServer implementation without changing token order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/HttpServer.cpp')
          original = source.read_text(encoding='utf-8')

          markers = [
              ('HttpServerCommon.inc', 'HttpServer::HttpServer('),
              ('HttpServerTransport.inc', 'std::string HttpServer::listInterfaces()'),
              ('HttpServerState.inc', 'std::string HttpServer::dvbAdapters()'),
              ('HttpServerDvbMedia.inc', 'void HttpServer::recordAllQualitySamples()'),
              ('HttpServerQuality.inc', 'std::string HttpServer::handleConfigExport()'),
              ('HttpServerConfigActions.inc', 'std::string HttpServer::renderIndexPage()'),
          ]

          def unique_position(needle: str) -> int:
              first = original.find(needle)
              if first < 0:
                  raise SystemExit(f'Missing HttpServer split marker: {needle}')
              if original.find(needle, first + 1) >= 0:
                  raise SystemExit(f'Non-unique HttpServer split marker: {needle}')
              # Split at the start of the complete source line so indentation or
              # return-type whitespace remains byte-for-byte identical.
              line_start = original.rfind('\n', 0, first)
              return 0 if line_start < 0 else line_start + 1

          boundaries = [0]
          for _name, marker in markers:
              boundaries.append(unique_position(marker))
          boundaries.append(len(original))
          if boundaries != sorted(boundaries) or len(set(boundaries)) != len(boundaries):
              raise SystemExit(f'Invalid HttpServer split order: {boundaries}')

          names = [
              'HttpServerCommon.inc',
              'HttpServerTransport.inc',
              'HttpServerState.inc',
              'HttpServerDvbMedia.inc',
              'HttpServerQuality.inc',
              'HttpServerConfigActions.inc',
              'HttpServerWebUi.inc',
          ]

          out_dir = Path('src/http')
          out_dir.mkdir(parents=True, exist_ok=True)
          reconstructed = []
          for index, name in enumerate(names):
              part = original[boundaries[index]:boundaries[index + 1]]
              if not part:
                  raise SystemExit(f'Empty HttpServer module: {name}')
              (out_dir / name).write_text(part, encoding='utf-8')
              reconstructed.append(part)
              print(f'{name}: bytes={len(part.encode("utf-8"))}')

          if ''.join(reconstructed) != original:
              raise SystemExit('Split validation failed: module concatenation differs from original HttpServer.cpp')

          wrapper = '''// HttpServer implementation is intentionally partitioned into focused\n// implementation fragments. They remain one translation unit so this structural\n// refactor cannot change anonymous-namespace visibility, static state, or linkage.\n// Keep the include order synchronized with src/http/README.md.\n#include "http/HttpServerCommon.inc"\n#include "http/HttpServerTransport.inc"\n#include "http/HttpServerState.inc"\n#include "http/HttpServerDvbMedia.inc"\n#include "http/HttpServerQuality.inc"\n#include "http/HttpServerConfigActions.inc"\n#include "http/HttpServerWebUi.inc"\n'''
          source.write_text(wrapper, encoding='utf-8')

          readme = '''# HttpServer implementation layout\n\n`src/HttpServer.cpp` is now a small composition unit. The implementation is split by responsibility while intentionally remaining a single C++ translation unit. This preserves the existing anonymous-namespace helpers, static state, macro behavior, and linkage during the structural refactor.\n\n- `HttpServerCommon.inc` — includes, shared helpers, URL/output helpers.\n- `HttpServerTransport.inc` — listener/session handling, authentication, HTTP port management.\n- `HttpServerState.inc` — interfaces, system metrics, runtime state serialization.\n- `HttpServerDvbMedia.inc` — DVB/CA endpoints and HTTP/HLS media delivery.\n- `HttpServerQuality.inc` — quality sampling, persistence, history API.\n- `HttpServerConfigActions.inc` — config import/export/save, backup and stream/subscriber actions.\n- `HttpServerWebUi.inc` — embedded Web UI returned by `renderIndexPage()`.\n\nThe include order is significant. A later cleanup can move individual groups to independent `.cpp` translation units after their shared helpers are given explicit interfaces.\n'''
          (out_dir / 'README.md').write_text(readme, encoding='utf-8')

          version = Path('src/AppVersion.h')
          version_text = version.read_text(encoding='utf-8')
          old = 'kProgramVersion = "10.8.152"'
          new = 'kProgramVersion = "10.8.153"'
          if old not in version_text:
              raise SystemExit('Unexpected program version before V10.8.153 refactor')
          version.write_text(version_text.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check

          # Remove this one-shot workflow from the resulting source tree.
          rm -f .github/workflows/httpserver-refactor.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V10.8.153 split HttpServer implementation modules"
          git push origin HEAD:refactor-httpserver-v153
