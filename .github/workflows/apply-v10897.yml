name: Apply V10.8.97 H26x TS discontinuity
on:
  push:
    branches:
      - work/v10.8.97-h26x-ts-discontinuity
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8.97-h26x-ts-discontinuity
      - name: Apply patch
        run: python3 .github/apply-v10897.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.97"' src/AppVersion.h
          grep -q 'discontinuity_indicator' src/media/NativeHlsSegmenter.cpp
          grep -q 'kFirstPayloadMax' src/media/NativeHlsSegmenter.cpp
      - name: C++ syntax check
        run: |
          g++ -std=c++17 -Isrc -I/usr/include -fsyntax-only src/media/NativeHlsSegmenter.cpp
      - name: Commit patched tree
        run: |
          rm -f .github/apply-v10897.py .github/workflows/apply-v10897.yml
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/AppVersion.h src/media/NativeHlsSegmenter.cpp .github/apply-v10897.py .github/workflows/apply-v10897.yml
          git commit -m 'V10.8.97 reset H26x TS continuity at HLS config prefix'
          git push origin HEAD:work/v10.8.97-h26x-ts-discontinuity
