name: Apply V10.8.114 stable PSI

on:
  push:
    branches:
      - v10.8.114-stable-psi

permissions:
  contents: write

jobs:
  apply-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.114-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.114-stable-psi
          fetch-depth: 0

      - name: Apply focused PSI/SI patch
        run: python3 tools/apply_v10_8_114_stable_psi.py

      - name: Compile remapper translation unit
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Isrc \
            -c src/media/MpegTsRemapper.cpp -o /tmp/MpegTsRemapper.o

      - name: Guard diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.114"' src/AppVersion.h
          git diff -- src/AppVersion.h src/media/MpegTsRemapper.h src/media/MpegTsRemapper.cpp

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppVersion.h src/media/MpegTsRemapper.h src/media/MpegTsRemapper.cpp
          git commit -m 'V10.8.114 stabilize remapped PSI/SI cadence [v10.8.114-applied]'
          git push origin HEAD:v10.8.114-stable-psi
