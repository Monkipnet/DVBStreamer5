name: V10.8.69 CA tile telemetry patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V10.8.69 patch
        shell: bash
        run: |
          if grep -q '"10.8.69"' src/AppVersion.h; then
            echo "V10.8.69 already applied"
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          h = Path('src/StreamManager.h')
          s = h.read_text()
          old = '''    std::atomic<uint64_t> outputTsPayloadPacketsDelta{0};
    std::atomic<uint64_t> outputTsScrambledPacketsDelta{0};
    std::atomic<uint64_t> outputTsClearPesStartsDelta{0};
'''
          new = '''    // Cumulative post-processing MPEG-TS counters sampled by the monitor
    // thread into the Delta values consumed by /api/state.  Collection happens
    // on the finished transport so the tile describes what clients actually get.
    std::atomic<uint64_t> outputTsPayloadPackets{0};
    std::atomic<uint64_t> outputTsScrambledPackets{0};
    std::atomic<uint64_t> outputTsClearPesStarts{0};
    std::atomic<uint64_t> outputTsPayloadPacketsDelta{0};
    std::atomic<uint64_t> outputTsScrambledPacketsDelta{0};
    std::atomic<uint64_t> outputTsClearPesStartsDelta{0};
'''
          if old not in s:
              raise SystemExit('StreamManager.h anchor not found')
          h.write_text(s.replace(old, new, 1))

          p = Path('src/StreamManager.cpp')
          s = p.read_text()
          old = '''    const std::string streamId = streamConfig.id;
    relay.observeTransport = [httpHub, previewHub, previewPassthrough, hlsSegmenter, cmafSegmenter, mpts, srtOutputs, rtspOutputs, rtmpOutputs, streamId](const uint8_t* data, std::size_t size) {
        if (hlsSegmenter) hlsSegmenter->push(data, size);
'''
          new = '''    const std::string streamId = streamConfig.id;
    StreamState* outputStatsState = state.get();
    relay.observeTransport = [httpHub, previewHub, previewPassthrough, hlsSegmenter, cmafSegmenter, mpts, srtOutputs, rtspOutputs, rtmpOutputs, streamId, outputStatsState](const uint8_t* data, std::size_t size) {
        // V10.8.69: derive CA tile health from the finished production TS.
        if (outputStatsState && data && size >= dvbstreamer5::media::mpegts::kPacketSize) {
            std::uint64_t payloadPackets = 0;
            std::uint64_t scrambledPackets = 0;
            std::uint64_t clearPesStarts = 0;
            for (std::size_t offset = 0;
                 offset + dvbstreamer5::media::mpegts::kPacketSize <= size;
                 offset += dvbstreamer5::media::mpegts::kPacketSize) {
                const std::uint8_t* packet = data + offset;
                if (packet[0] != dvbstreamer5::media::mpegts::kSyncByte) continue;
                const std::uint16_t pid = static_cast<std::uint16_t>(
                    (static_cast<std::uint16_t>(packet[1] & 0x1fU) << 8) | packet[2]);
                if (pid == 0x0000U || pid == 0x0001U || pid == 0x0011U || pid == 0x1fffU) continue;
                const std::uint8_t adaptationControl =
                    static_cast<std::uint8_t>((packet[3] >> 4) & 0x03U);
                if ((adaptationControl & 0x01U) == 0) continue;
                std::size_t payloadOffset = 4;
                if ((adaptationControl & 0x02U) != 0) {
                    payloadOffset = 5U + packet[4];
                    if (payloadOffset >= dvbstreamer5::media::mpegts::kPacketSize) continue;
                }
                ++payloadPackets;
                const std::uint8_t scramblingControl =
                    static_cast<std::uint8_t>((packet[3] >> 6) & 0x03U);
                if (scramblingControl == 2U || scramblingControl == 3U) ++scrambledPackets;
                if ((packet[1] & 0x40U) != 0 && scramblingControl == 0U &&
                    payloadOffset + 3U <= dvbstreamer5::media::mpegts::kPacketSize &&
                    packet[payloadOffset] == 0x00U &&
                    packet[payloadOffset + 1U] == 0x00U &&
                    packet[payloadOffset + 2U] == 0x01U) {
                    ++clearPesStarts;
                }
            }
            outputStatsState->outputTsPayloadPackets.fetch_add(payloadPackets, std::memory_order_relaxed);
            outputStatsState->outputTsScrambledPackets.fetch_add(scrambledPackets, std::memory_order_relaxed);
            outputStatsState->outputTsClearPesStarts.fetch_add(clearPesStarts, std::memory_order_relaxed);
        }
        if (hlsSegmenter) hlsSegmenter->push(data, size);
'''
          if old not in s:
              raise SystemExit('observeTransport anchor not found')
          s = s.replace(old, new, 1)

          old = '''void StreamManager::monitorNativeStream(StreamState* state) {
    uint64_t lastIn = 0, lastOut = 0, lastPayloadOut = 0, lastCc = 0;
'''
          new = '''void StreamManager::monitorNativeStream(StreamState* state) {
    uint64_t lastIn = 0, lastOut = 0, lastPayloadOut = 0, lastCc = 0;
    uint64_t lastTsPayloadPackets = 0;
    uint64_t lastTsScrambledPackets = 0;
    uint64_t lastTsClearPesStarts = 0;
'''
          if old not in s:
              raise SystemExit('monitor header anchor not found')
          s = s.replace(old, new, 1)

          old = '''        state->inputCcErrors.store(cc);
        state->inputCcErrorsDelta.store(cc - lastCc);
        lastIn = in;
'''
          new = '''        state->inputCcErrors.store(cc);
        state->inputCcErrorsDelta.store(cc - lastCc);
        const std::uint64_t tsPayloadPackets = state->outputTsPayloadPackets.load(std::memory_order_relaxed);
        const std::uint64_t tsScrambledPackets = state->outputTsScrambledPackets.load(std::memory_order_relaxed);
        const std::uint64_t tsClearPesStarts = state->outputTsClearPesStarts.load(std::memory_order_relaxed);
        state->outputTsPayloadPacketsDelta.store(tsPayloadPackets - lastTsPayloadPackets, std::memory_order_relaxed);
        state->outputTsScrambledPacketsDelta.store(tsScrambledPackets - lastTsScrambledPackets, std::memory_order_relaxed);
        state->outputTsClearPesStartsDelta.store(tsClearPesStarts - lastTsClearPesStarts, std::memory_order_relaxed);
        lastTsPayloadPackets = tsPayloadPackets;
        lastTsScrambledPackets = tsScrambledPackets;
        lastTsClearPesStarts = tsClearPesStarts;
        lastIn = in;
'''
          if old not in s:
              raise SystemExit('monitor delta anchor not found')
          p.write_text(s.replace(old, new, 1))

          v = Path('src/AppVersion.h')
          s = v.read_text()
          if '"10.8.68"' not in s:
              raise SystemExit('version anchor not found')
          v.write_text(s.replace('"10.8.68"', '"10.8.69"', 1))
          PY

          git diff --check
          grep -n 'kProgramVersion' src/AppVersion.h
          grep -n 'outputTsPayloadPackets{' src/StreamManager.h
          grep -n 'V10.8.69' src/StreamManager.cpp

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppVersion.h src/StreamManager.h src/StreamManager.cpp
          git commit -m 'V10.8.69 fix CA decode tile telemetry'
          git push origin HEAD:staging/v10.8.69-ca-tile
