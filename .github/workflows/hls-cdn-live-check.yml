name: HLS CDN live source diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hls-cdn-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hls-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe playlists and media segments from GitHub runner
        shell: bash
        run: |
          cat > /tmp/probe_hls.py <<'PY'
          import urllib.request, urllib.parse, urllib.error, time, re, json
          SOURCES = {
              "soyuz": "https://hls-tvsoyuz.cdnvideo.ru/tvsoyuz/soyuz/playlist.m3u8",
              "zala": "http://mfe08.svc.ott.zala.by/hls/9F67L3DGIF_HLS/bw2000000/playlist.m3u8",
          }
          headers = {"User-Agent": "Mozilla/5.0 DVBStreamer5-HLS-Diagnostic/1.0"}
          results = {}
          def get(url, limit=1024*1024, timeout=12):
              started = time.monotonic()
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      data = resp.read(limit)
                      return dict(ok=True, status=resp.status, ms=round((time.monotonic()-started)*1000),
                                  url=resp.url, body=data, content_type=resp.headers.get("Content-Type",""))
              except Exception as exc:
                  return dict(ok=False, status=getattr(exc, "code", 0), ms=round((time.monotonic()-started)*1000),
                              error=str(exc)[:180], url=url)
          for name, root in SOURCES.items():
              entries = []
              sequences = []
              for attempt in range(6):
                  item = get(root)
                  entry = dict(sample=attempt+1, http=item["status"], ms=item["ms"], ok=item["ok"])
                  if item["ok"]:
                      txt = item["body"].decode("utf-8", "replace")
                      entry["m3u8"] = txt.lstrip().startswith("#EXTM3U")
                      m = re.search(r"#EXT-X-MEDIA-SEQUENCE:(\d+)", txt)
                      entry["sequence"] = int(m.group(1)) if m else None
                      if m: sequences.append(int(m.group(1)))
                      lines = [l.strip() for l in txt.splitlines() if l.strip() and not l.startswith("#")]
                      if lines:
                          segment = urllib.parse.urljoin(item["url"], lines[-1])
                          if "#EXT-X-STREAM-INF" in txt:
                              nested = get(segment)
                              entry["variant_http"] = nested["status"]
                              if nested["ok"]:
                                  nlines = [l.strip() for l in nested["body"].decode("utf-8","replace").splitlines() if l.strip() and not l.startswith("#")]
                                  if nlines: segment=urllib.parse.urljoin(nested["url"],nlines[-1])
                          if attempt in (0,3,5):
                              media = get(segment, limit=4096)
                              entry["media_http"] = media["status"]
                              entry["media_bytes"] = len(media.get("body",b""))
                              entry["media_ms"] = media["ms"]
                  else:
                      entry["error"] = item.get("error","")
                  entries.append(entry)
                  print(name, json.dumps(entry, ensure_ascii=False), flush=True)
                  if attempt < 5: time.sleep(8)
              results[name] = dict(url=root, samples=entries, playlist_advanced=(len(set(sequences))>1) if sequences else None)
          with open("hls-cdn-live-check.json","w") as out: json.dump(results,out,indent=2)
          failures = [n for n,r in results.items() if not any(s.get("ok") and s.get("m3u8") for s in r["samples"])]
          if failures: print("Sources unavailable from GitHub runner:", ", ".join(failures))
          PY
          python3 /tmp/probe_hls.py
      - name: Upload HLS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls-cdn-live-check
          path: hls-cdn-live-check.json
          if-no-files-found: warn
