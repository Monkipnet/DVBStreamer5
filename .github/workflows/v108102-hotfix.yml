name: V10.8.102 ABR hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v108102-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate V10.8.102
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          version_path = Path('src/AppVersion.h')
          stream_path = Path('src/StreamManager.cpp')
          pipe_path = Path('src/media/NativeTranscoderPipeline.cpp')

          # 1) Version.
          version = version_path.read_text()
          old_version = 'inline constexpr const char* kProgramVersion = "10.8.101";'
          new_version = 'inline constexpr const char* kProgramVersion = "10.8.102";'
          if version.count(old_version) != 1:
              raise SystemExit('AppVersion.h: expected V10.8.101 exactly once')
          version_path.write_text(version.replace(old_version, new_version, 1))

          # 2) HLS ABR geometry: lock the configured output geometry before
          # initialization. This is scoped to multibitrate HLS only.
          lines = stream_path.read_text().splitlines(keepends=True)
          service_matches = [i for i, line in enumerate(lines)
                             if line.strip() == 'tc.serviceProvider = streamConfig.serviceProvider;']
          if len(service_matches) != 1:
              raise SystemExit(f'StreamManager.cpp: serviceProvider anchor count={len(service_matches)}')
          i = service_matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          if i + 1 >= len(lines) or lines[i + 1].strip() != 'std::string transcodeError;':
              raise SystemExit('StreamManager.cpp: transcodeError anchor not found after serviceProvider')
          geometry_block = [
              f'{indent}// V10.8.102: HLS ABR must honor configured display geometry.\n',
              f'{indent}// Anamorphic DVB SD may be coded as 720x576 while displaying 16:9;\n',
              f'{indent}// treating coded pixels as square pixels used to turn ABR back into 4:3.\n',
              f'{indent}// Direct/single-bitrate paths keep their existing geometry behavior.\n',
              f'{indent}if (hasHlsOutput && streamConfig.transcodeMultibitrateEnabled &&\n',
              f'{indent}    tc.videoCodec != "copy") {{\n',
              f'{indent}    tc.lockOutputGeometry = true;\n',
              f'{indent}}}\n',
          ]
          lines[i + 1:i + 1] = geometry_block

          # Remove the second ABR-only source-pixel clamp in the decoded-frame
          # observer. The pipeline is now explicitly locked for ABR before init.
          starts = [j for j, line in enumerate(lines)
                    if line.strip() == 'const std::uint64_t sourcePixels =']
          if len(starts) != 1:
              raise SystemExit(f'StreamManager.cpp: sourcePixels anchor count={len(starts)}')
          start = starts[0]
          if_line = None
          for j in range(start, min(start + 30, len(lines))):
              if lines[j].strip().startswith('if (sourcePixels > 0 &&'):
                  if_line = j
                  break
          if if_line is None:
              raise SystemExit('StreamManager.cpp: sourcePixels if block not found')
          depth = 0
          end = None
          for j in range(if_line, min(if_line + 30, len(lines))):
              depth += lines[j].count('{') - lines[j].count('}')
              if j > if_line and depth == 0:
                  end = j
                  break
          if end is None:
              raise SystemExit('StreamManager.cpp: sourcePixels if closing brace not found')
          # Include one trailing blank line to keep formatting tidy.
          remove_end = end + 1
          if remove_end < len(lines) and lines[remove_end].strip() == '':
              remove_end += 1
          del lines[start:remove_end]

          # 3) ABR output draining: snapshot active variants while holding the
          # small state lock, but never hold it across pollOutput/segmenter I/O.
          start_matches = [j for j, line in enumerate(lines)
                           if 'relay.observeInputTransport = [statePtr](const std::uint8_t*, std::size_t) {' in line]
          if len(start_matches) != 1:
              raise SystemExit(f'StreamManager.cpp: ABR output callback count={len(start_matches)}')
          cb_start = start_matches[0]
          cb_indent = lines[cb_start][:len(lines[cb_start]) - len(lines[cb_start].lstrip())]
          depth = 0
          cb_end = None
          for j in range(cb_start, len(lines)):
              depth += lines[j].count('{') - lines[j].count('}')
              if j > cb_start and depth == 0 and lines[j].strip() == '};':
                  cb_end = j
                  break
          if cb_end is None:
              raise SystemExit('StreamManager.cpp: ABR output callback end not found')
          I = cb_indent
          replacement = f'''{I}relay.observeInputTransport = [statePtr](const std::uint8_t*, std::size_t) {{
{I}    if (!statePtr) return;
{I}    // V10.8.102: never hold hlsAbrMutex across mux draining or HLS file I/O.
{I}    // The primary audio worker uses the same mutex for shared encoded audio;
{I}    // segment rotation under this lock could make AAC arrive hundreds of ms late.
{I}    std::vector<StreamState::HlsAbrVariantRuntime*> targets;
{I}    {{
{I}        std::lock_guard<std::mutex> abrLock(statePtr->hlsAbrMutex);
{I}        for (auto& variant : statePtr->hlsAbrVariants) {{
{I}            if (!variant || !variant->enabled || variant->failed ||
{I}                !variant->transcoder || !variant->segmenter) continue;
{I}            targets.push_back(variant.get());
{I}        }}
{I}    }}
{I}    for (auto* variant : targets) {{
{I}        std::vector<std::uint8_t> encoded;
{I}        std::string abrError;
{I}        if (!variant->transcoder->pollOutput(encoded, abrError)) {{
{I}            const std::string message = abrError.empty()
{I}                ? "native ABR output poll failed" : abrError;
{I}            {{
{I}                std::lock_guard<std::mutex> abrLock(statePtr->hlsAbrMutex);
{I}                variant->failed = true;
{I}                variant->lastError = message;
{I}            }}
{I}            std::cerr << "NATIVE HLS ABR ERROR name=" << variant->name
{I}                      << " error=" << message << std::endl;
{I}            continue;
{I}        }}
{I}        if (!encoded.empty() &&
{I}            !variant->segmenter->push(encoded.data(), encoded.size())) {{
{I}            const std::string message = variant->segmenter->lastError();
{I}            {{
{I}                std::lock_guard<std::mutex> abrLock(statePtr->hlsAbrMutex);
{I}                variant->failed = true;
{I}                variant->lastError = message;
{I}            }}
{I}            std::cerr << "NATIVE HLS ABR ERROR name=" << variant->name
{I}                      << " error=" << message << std::endl;
{I}        }}
{I}    }}
{I}}};
'''.splitlines(keepends=True)
          lines[cb_start:cb_end + 1] = replacement
          stream_path.write_text(''.join(lines))

          # 4) Shared encoded audio: V10.8.101 needs dynamic codec discovery only
          # for audio=copy. AAC/MP2 are already configured at initialize().
          plines = pipe_path.read_text().splitlines(keepends=True)
          fn_matches = [j for j, line in enumerate(plines)
                        if line.startswith('bool NativeTranscoderPipeline::pushEncodedAudioFrame(')]
          if len(fn_matches) != 1:
              raise SystemExit(f'NativeTranscoderPipeline.cpp: pushEncodedAudioFrame count={len(fn_matches)}')
          fn_start = fn_matches[0]
          next_matches = [j for j in range(fn_start + 1, len(plines))
                          if plines[j].startswith('bool NativeTranscoderPipeline::pollOutput(')]
          if not next_matches:
              raise SystemExit('NativeTranscoderPipeline.cpp: pollOutput anchor missing')
          fn_end = next_matches[0]
          new_fn = '''bool NativeTranscoderPipeline::pushEncodedAudioFrame(
    mpegts::ElementaryCodec codec,
    const codec::EncodedAudioFrame& frame, std::uint64_t duration90k) {
    if (!externalAudioInput_.load(std::memory_order_acquire) ||
        failed_.load(std::memory_order_acquire) ||
        codec == mpegts::ElementaryCodec::Unknown) return false;

    // V10.8.102: shared ABR audio bypasses this rendition's demux. Only
    // audio=copy must learn the elementary codec dynamically from the primary
    // PMT. AAC/MP2 outputs configure their mux codec during initialize(), so
    // taking muxMutex_ for every 20-24 ms frame only creates avoidable latency.
    std::string localError;
    if (config_.audioCodec == "copy") {
        std::lock_guard<std::mutex> lock(muxMutex_);
        if (!mux_.setCodec(mpegts::ElementaryKind::Audio, codec, localError)) {
            setFailure(localError);
            return false;
        }
    }
    return emitAudio(frame, duration90k, localError);
}

'''.splitlines(keepends=True)
          plines[fn_start:fn_end] = new_fn
          pipe_path.write_text(''.join(plines))

          # Structural guards: fail before commit if any expected property is absent.
          stream = stream_path.read_text()
          pipe = pipe_path.read_text()
          checks = [
              ('10.8.102' in version_path.read_text(), 'version bump missing'),
              (stream.count('tc.lockOutputGeometry = true;') >= 2,
               'ABR geometry lock missing (preview + ABR expected)'),
              ('primaryPixelsRequested' not in stream, 'old ABR geometry clamp remains'),
              ('never hold hlsAbrMutex across mux draining or HLS file I/O' in stream,
               'ABR output lock fix missing'),
              ('if (config_.audioCodec == "copy")' in pipe,
               'audio=copy codec gate missing'),
          ]
          for ok, message in checks:
              if not ok:
                  raise SystemExit(message)
          PY

          git diff --check
          grep -n 'kProgramVersion' src/AppVersion.h
          grep -n 'HLS ABR must honor configured display geometry' src/StreamManager.cpp
          grep -n 'never hold hlsAbrMutex' src/StreamManager.cpp
          grep -n 'if (config_.audioCodec == "copy")' src/media/NativeTranscoderPipeline.cpp

      - name: Commit and push V10.8.102
        shell: bash
        run: |
          rm -f .github/workflows/v108102-hotfix.yml
          git config user.name 'Monkipnet'
          git config user.email 'monkipnet@yandex.ru'
          git add src/AppVersion.h src/StreamManager.cpp src/media/NativeTranscoderPipeline.cpp .github/workflows/v108102-hotfix.yml
          git diff --cached --check
          git commit -m 'V10.8.102 stabilize ABR audio and preserve 16:9 geometry'
          git push origin HEAD:main
