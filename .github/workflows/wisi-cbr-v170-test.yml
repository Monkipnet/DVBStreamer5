name: wisi-cbr-v170-test

on:
  push:
    branches:
      - wisi-cbr-v170

permissions:
  contents: read

jobs:
  syntax-and-pacing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Syntax check
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_header.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_header.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: Startup anchor and bounded phase test
        run: |
          cat >/tmp/test_v170.cpp <<'EOF'
          #include "media/CbrTsPacer.h"
          #include <cassert>
          #include <chrono>
          #include <cstdint>
          #include <iostream>
          using namespace dvbstreamer5::media::mpegts;
          static Packet packet() {
              Packet p{};
              p.fill(0xff);
              p[0]=kSyncByte;
              p[1]=0x01;
              p[2]=0x00;
              p[3]=0x10;
              return p;
          }
          int main() {
              constexpr std::uint64_t rate=4000000ULL;
              constexpr std::uint64_t bits=7ULL*188ULL*8ULL;
              constexpr std::uint64_t period=bits*1000000000ULL/rate;
              constexpr std::uint64_t correction=period/400ULL;
              CbrTsPacer p(rate);
              for(int i=0;i<2000;++i) assert(p.enqueue(packet()));
              CbrDatagram out{};
              const auto d0=p.nextDeadline();
              const auto startup=d0+std::chrono::milliseconds(1200);
              assert(p.nextDatagram(startup,out));
              const auto d1=p.nextDeadline();
              auto gap=std::chrono::duration_cast<std::chrono::nanoseconds>(d1-startup).count();
              assert(gap>=static_cast<long long>(period));
              assert(gap<=static_cast<long long>(period+1));
              const auto late=d1+std::chrono::microseconds(200);
              assert(p.nextDatagram(late,out));
              const auto d2=p.nextDeadline();
              gap=std::chrono::duration_cast<std::chrono::nanoseconds>(d2-late).count();
              assert(gap>=static_cast<long long>(period-correction));
              assert(gap<=static_cast<long long>(period-correction+1));
              const long double instant=static_cast<long double>(bits)*1000000000.0L/static_cast<long double>(gap);
              assert(instant<4011000.0L);
              std::cout << "period_ns=" << period << " correction_ns=" << correction
                        << " next_gap_ns=" << gap << " instant_bps=" << static_cast<unsigned long long>(instant) << "\n";
              return 0;
          }
          EOF
          g++ -std=c++17 -pthread -Isrc /tmp/test_v170.cpp src/media/CbrTsPacer.cpp -o /tmp/test_v170
          /tmp/test_v170
