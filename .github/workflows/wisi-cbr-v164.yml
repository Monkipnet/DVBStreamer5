name: wisi-cbr-v164

on:
  push:
    branches:
      - wisi-cbr-v164

permissions:
  contents: write

jobs:
  transform-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply WISI CBR V164
        run: |
          python3 tools/apply_wisi_cbr_v164.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/media/NativeUdpRelay.cpp')
          s = p.read_text()
          needle = '\n    {\n        std::lock_guard<std::mutex> lock(observedCbrMutex);'
          if needle not in s:
              raise SystemExit('cleanup marker not found')
          s = s.replace(needle, '\n    }\n' + needle, 1)
          p.write_text(s)
          PY

      - name: Validate diff
        run: |
          git diff --check
          test "$(grep -c 'kProgramVersion = \"10.8.164\"' src/AppVersion.h)" = "1"
          test -f src/media/WisiCbrOutputWorker.h
          test ! -e src/media/TvSatCbrOutputWorker.h
          ! grep -R "TVStreammerSAT5 CBR" -n src/media/CbrTsPacer.cpp src/media/NativeUdpRelay.cpp

      - name: Syntax check CBR core
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_cbr_header_check.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_cbr_header_check.cpp

      - name: Syntax check relay
        run: g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: Commit clean V164
        run: |
          git config user.name "Monkipnet"
          git config user.email "monkipnet@yandex.ru"
          git add -A
          git commit -m "V10.8.164 introduce dedicated WISI fixed CBR"
          git push origin HEAD:wisi-cbr-v164
