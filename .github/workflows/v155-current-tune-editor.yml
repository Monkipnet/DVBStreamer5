name: One-shot V10.8.155 current DVB tune editor

on:
  push:
    branches:
      - v10.8.155-dvb-configured-usage

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: v10.8.155-dvb-configured-usage
          fetch-depth: 0

      - name: Apply occupied frontend settings patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v155_current_tune_patch.py
          git diff --check
          grep -F 'applySelectedDvbFrontendTuneToForm' src/http/HttpServerWebUi.inc
          grep -F 'lnb_lof1_khz' src/http/HttpServerDvbMedia.inc
          grep -F 'kProgramVersion = "10.8.155"' src/AppVersion.h
          rm -f scripts/v155_current_tune_patch.py
          rm -f .github/workflows/v155-current-tune-editor.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V10.8.155 expose occupied DVB tune in scanner"
          git push origin HEAD:v10.8.155-dvb-configured-usage
