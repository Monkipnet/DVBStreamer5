name: V162 SAT5 source PCR validation
on:
  push:
    branches: [work/v162-sat5-source-pcr]
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V162 transformer
        run: python3 tools/apply_v162_sat5_source_pcr.py
      - name: Diff check
        run: git diff --check
      - name: Syntax check CBR core
        run: g++ -std=c++20 -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
      - name: Commit generated V162 tree
        run: |
          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add src/AppVersion.h src/media/CbrTsPacer.cpp
          git commit -m 'V10.8.162 preserve source PCR for SAT5 SRT/HTTP CBR [skip ci]'
          git rm tools/apply_v162_sat5_source_pcr.py .github/workflows/v162-sat5-source-pcr.yml
          git commit -m 'Remove temporary V162 validation files [skip ci]'
          git push origin HEAD:work/v162-sat5-source-pcr
