name: Apply V10.8.115 persistent quality history

on:
  push:
    branches:
      - v10.8.115-quality-history

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.115-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.115-quality-history
          fetch-depth: 0

      - name: Apply focused history patch
        run: python3 tools/apply_v10_8_115_persistent_quality_history.py

      - name: Guard focused diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.115"' src/AppVersion.h
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/AppVersion.h src/HttpServer.cpp src/HttpServer.h "

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config \
            libpcsclite-dev libssl-dev libcrypt-dev \
            ca-certificates curl binutils nasm autoconf automake libtool

      - name: Vendor locked media dependencies
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          bash scripts/build_native_codecs.sh

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Verify primary artifacts
        run: |
          test -x build/DVBStreamer5
          test -f build/ca-plugins/dvbstreamer5-ca-newcamd.so
          test -x build/oscam-mini/oscam-mini
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppVersion.h src/HttpServer.cpp src/HttpServer.h
          git commit -m 'V10.8.115 persist quality history independently of Web UI [v10.8.115-applied]'
          git push origin HEAD:v10.8.115-quality-history
