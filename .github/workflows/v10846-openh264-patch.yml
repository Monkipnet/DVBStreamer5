name: V10.8.46 OpenH264 parameter priming check

on:
  push:
    branches:
      - repair/openh264-param-prime-v10846

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/openh264-param-prime-v10846
          fetch-depth: 0

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Apply production patch
        run: python3 .github/v10.8.46_apply.py

      - name: Build vendored codec headers and libraries
        run: |
          chmod +x scripts/vendor_native_codecs.sh scripts/build_native_codecs.sh
          ./scripts/vendor_native_codecs.sh
          DVBSTREAMER5_CODEC_JOBS=2 ./scripts/build_native_codecs.sh

      - name: Syntax check native codec wrapper
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror=return-type \
            -Isrc \
            -Ithird_party/native-codecs-prefix/include \
            -Ithird_party/native-codecs-prefix/include/ittiam-mpeg2 \
            -fsyntax-only src/media/NativeCodecVendored.cpp

      - name: Check production diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.46"' src/AppVersion.h
          grep -F 'NATIVE AVC PARAM PRIME state=' src/media/NativeCodecVendored.cpp
          grep -F 'parameterPrimeCalls_' src/media/NativeCodecVendored.cpp

      - name: Commit production patch
        run: |
          git config user.name 'DVBStreamer5 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/AppVersion.h src/media/NativeCodecVendored.cpp
          git commit -m 'V10.8.46 prime OpenH264 parameter sets'
          git push origin HEAD:repair/openh264-param-prime-v10846
