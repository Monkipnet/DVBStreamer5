name: Check NVENC syntax

on:
  push:
    paths:
      - .github/workflows/check-nvenc-syntax.yml

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V10.8.38 portability fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/media/NativeHardwareCodec.cpp')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches={count}')
              s = s.replace(old, new)

          replace_once(
          '''#include <dlfcn.h>
          #include <cctype>
          #include <unistd.h>
          #include <iostream>
          ''',
          '''#include <dlfcn.h>
          #include <cctype>
          #include <unistd.h>
          #if defined(__linux__)
          #include <fcntl.h>
          #endif
          #include <iostream>
          ''',
          'linux fcntl insertion')

          replace_once(
          '''#if defined(DVBSTREAMER5_HAVE_VAAPI)
          #include <fcntl.h>
          #include <va/va.h>
          ''',
          '''#if defined(DVBSTREAMER5_HAVE_VAAPI)
          #include <va/va.h>
          ''',
          'VAAPI fcntl removal')

          replace_once(
          '''            if (!end || *end != '\\0' || value < 0 || value > 1024) {
          ''',
          '''            if (!end || end == gpu || *end != '\\0' || value < 0 || value > 1024) {
          ''',
          'GPU ordinal validation')

          replace_once(
          '''        GUID presetGuid = NV_ENC_PRESET_LOW_LATENCY_HP_GUID;
                  const char* presetName = "legacy-low-latency-hp";
                  bool modernLowLatency = false;
                  bool presetLoaded = false;
          #if defined(NVENCAPI_MAJOR_VERSION) && NVENCAPI_MAJOR_VERSION >= 10
          ''',
          '''#if defined(NVENCAPI_MAJOR_VERSION) && NVENCAPI_MAJOR_VERSION >= 10
                  GUID presetGuid = NV_ENC_PRESET_P3_GUID;
                  const char* presetName = "p3";
          #else
                  GUID presetGuid = NV_ENC_PRESET_LOW_LATENCY_HP_GUID;
                  const char* presetName = "legacy-low-latency-hp";
          #endif
                  bool modernLowLatency = false;
                  bool presetLoaded = false;
          #if defined(NVENCAPI_MAJOR_VERSION) && NVENCAPI_MAJOR_VERSION >= 10
          ''',
          'modern preset fallback')

          path.write_text(s)

          version = Path('src/AppVersion.h')
          v = version.read_text()
          oldv = 'inline constexpr const char* kProgramVersion = "10.8.37";'
          newv = 'inline constexpr const char* kProgramVersion = "10.8.38";'
          if v.count(oldv) != 1:
              raise SystemExit(f'version marker matches={v.count(oldv)}')
          version.write_text(v.replace(oldv, newv))
          PY

          git diff --check

      - name: Syntax check against NVENC SDK 11.1 and current headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nv11 /tmp/nvcurrent
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/nv-codec-headers/n11.1.5.2/include/ffnvcodec/nvEncodeAPI.h -o /tmp/nv11/nvEncodeAPI.h
          curl -fsSL https://raw.githubusercontent.com/FFmpeg/nv-codec-headers/master/include/ffnvcodec/nvEncodeAPI.h -o /tmp/nvcurrent/nvEncodeAPI.h
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -DDVBSTREAMER5_HAVE_NVENC_HEADERS=1 -Isrc -I/tmp/nv11 -fsyntax-only src/media/NativeHardwareCodec.cpp
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -DDVBSTREAMER5_HAVE_NVENC_HEADERS=1 -Isrc -I/tmp/nvcurrent -fsyntax-only src/media/NativeHardwareCodec.cpp

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DVBStreamer5 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/media/NativeHardwareCodec.cpp src/AppVersion.h
          git commit -m "Stage 9 V10.8.38 validate NVENC low-latency across SDK versions"
          git push origin HEAD:main
