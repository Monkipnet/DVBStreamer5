name: Apply V10.8.122 PacketFramer fast path

on:
  push:
    branches:
      - v10.8.122-packetframer-fastpath

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.122-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.122-packetframer-fastpath
          fetch-depth: 0

      - name: Apply focused V10.8.122 optimization
        run: python3 tools/apply_v10_8_122_packetframer_fastpath.py

      - name: Guard focused diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.122"' src/AppVersion.h
          grep -F 'V10.8.122: most native paths already deliver MPEG-TS' src/media/TransportStream.cpp
          grep -F 'packets.reserve(packets.size() + estimatedPackets);' src/media/TransportStream.cpp
          grep -F 'if (pending_.empty()) {' src/media/TransportStream.cpp
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/AppVersion.h src/media/TransportStream.cpp "
          git diff -- src/media/NativeUdpRelay.cpp src/media/CbrTsPacer.cpp src/media/SharedDvbInputPool.cpp src/media/MpegTsRemapper.cpp src/media/NativeHlsSegmenter.cpp src/StreamManager.cpp | (! grep .)

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config \
            libpcsclite-dev libssl-dev libcrypt-dev \
            ca-certificates curl binutils nasm autoconf automake libtool

      - name: Vendor locked media dependencies
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          bash scripts/build_native_codecs.sh

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Verify primary artifacts
        run: |
          test -x build/DVBStreamer5
          test -f build/ca-plugins/dvbstreamer5-ca-newcamd.so
          test -x build/oscam-mini/oscam-mini
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppVersion.h src/media/TransportStream.cpp
          git commit -m 'V10.8.122 add aligned PacketFramer fast path [v10.8.122-applied]'
          git push origin HEAD:v10.8.122-packetframer-fastpath
