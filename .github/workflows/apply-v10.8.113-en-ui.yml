name: Apply V10.8.113 English UI

on:
  push:
    branches: [v10.8.113-en-ui]
    paths:
      - '.github/workflows/apply-v10.8.113-en-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V10.8.113 UI changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Monkipnet"
          git config user.email "monkipnet@yandex.ru"
          python3 -m py_compile tools/apply_v10_8_113_en_ui.py
          python3 tools/apply_v10_8_113_en_ui.py
          git diff --check
          grep -q 'kProgramVersion = "10.8.113"' src/AppVersion.h
          grep -q 'function tileRuntimeStatus(value)' src/HttpServer.cpp
          grep -q "replace(/\\\\bnative\\\\s+/gi, '')" src/HttpServer.cpp
          grep -q "Subscriber name, IP address, Status" src/HttpServer.cpp
          grep -q "Transponder channel mode" src/HttpServer.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config libssl-dev libcrypt-dev \
            ca-certificates curl binutils nasm autoconf automake libtool \
            libpcsclite-dev pcscd

      - name: Prepare vendored media dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          bash scripts/build_native_codecs.sh

      - name: Configure Release build
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build-ci --parallel 2

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add -u src/AppVersion.h src/HttpServer.cpp
          git diff --cached --check
          git commit -m "V10.8.113 refresh English UI and clean tile status"
          git push origin HEAD:v10.8.113-en-ui
