name: preview-patch-check
on: [push]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/apply_preview_v10_8_69.py
      - run: git diff --check
      - run: grep -n 'kProgramVersion' src/AppVersion.h
      - run: grep -n 'previewTc.videoEncoder' src/StreamManager.cpp
      - run: grep -n 'lockOutputGeometry = true' src/StreamManager.cpp
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppVersion.h src/StreamManager.cpp src/StreamManager.h
          git commit -m 'V10.8.69 restore V10.8.41 browser preview pipeline'
          git push origin HEAD:staging/v10.8.69-preview-41
