name: wisi-cbr-v167

on:
  push:
    branches:
      - wisi-cbr-v167

permissions:
  contents: read

jobs:
  syntax-and-pcr-segments:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Syntax check
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_header.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_header.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: Exact PCR segment test
        run: |
          cat >/tmp/test_wisi_segment.cpp <<'EOF'
          #include "media/CbrTsPacer.h"
          #include <cassert>
          #include <chrono>
          #include <cstdint>
          #include <iostream>
          #include <vector>

          using namespace dvbstreamer5::media::mpegts;

          static Packet dataPacket(std::uint8_t cc) {
              Packet p{};
              p.fill(0xff);
              p[0] = kSyncByte;
              p[1] = 0x01;
              p[2] = 0x00;
              p[3] = static_cast<std::uint8_t>(0x10U | (cc & 0x0fU));
              return p;
          }

          static Packet pcrPacket(std::uint64_t ticks, std::uint8_t cc) {
              Packet p = dataPacket(cc);
              p[3] = static_cast<std::uint8_t>(0x30U | (cc & 0x0fU));
              p[4] = 7;
              p[5] = 0x10;
              const std::uint64_t base = ticks / 300ULL;
              const std::uint64_t ext = ticks % 300ULL;
              p[6] = static_cast<std::uint8_t>(base >> 25U);
              p[7] = static_cast<std::uint8_t>(base >> 17U);
              p[8] = static_cast<std::uint8_t>(base >> 9U);
              p[9] = static_cast<std::uint8_t>(base >> 1U);
              p[10] = static_cast<std::uint8_t>(((base & 1ULL) << 7U) | 0x7eU | ((ext >> 8U) & 1ULL));
              p[11] = static_cast<std::uint8_t>(ext & 0xffU);
              return p;
          }

          static bool hasPcr(const Packet& p) {
              if (p[0] != kSyncByte) return false;
              const unsigned afc = (p[3] >> 4U) & 3U;
              return (afc == 2U || afc == 3U) && p[4] >= 7U && (p[5] & 0x10U);
          }

          static bool isNull(const Packet& p) {
              return (((static_cast<unsigned>(p[1]) & 0x1fU) << 8U) | p[2]) == 0x1fffU;
          }

          int main() {
              constexpr std::uint64_t target = 6000000ULL;
              constexpr std::uint64_t useful = 4000000ULL;
              constexpr std::uint64_t packetBits = 188ULL * 8ULL;
              constexpr std::uint64_t clock = 27000000ULL;
              constexpr std::uint64_t delta = (100ULL * packetBits * clock) / useful;

              CbrTsPacer pacer(target);
              std::uint64_t pcr = 0;
              for (unsigned segment = 0; segment < 4; ++segment) {
                  assert(pacer.enqueue(pcrPacket(pcr, static_cast<std::uint8_t>(segment))));
                  for (unsigned i = 0; i < 99; ++i) {
                      assert(pacer.enqueue(dataPacket(static_cast<std::uint8_t>(i))));
                  }
                  pcr += delta;
              }

              assert(pacer.timingLocked());
              assert(pacer.readySegments() >= 3);

              std::vector<std::size_t> pcrSlots;
              std::size_t slot = 0;
              std::size_t realFirst150 = 0;
              std::size_t nullFirst150 = 0;
              while (slot < 450) {
                  CbrDatagram out{};
                  assert(pacer.nextDatagram(pacer.nextDeadline(), out));
                  for (const auto& packet : out) {
                      if (slot < 450 && hasPcr(packet)) pcrSlots.push_back(slot);
                      if (slot < 150) {
                          if (isNull(packet)) ++nullFirst150;
                          else ++realFirst150;
                      }
                      ++slot;
                  }
              }

              assert(pcrSlots.size() >= 3);
              assert(pcrSlots[0] == 0);
              assert(pcrSlots[1] == 150);
              assert(pcrSlots[2] == 300);
              assert(realFirst150 == 100);
              assert(nullFirst150 == 50);
              assert(pacer.insufficientTargetSegments() == 0);

              std::cout << "PCR slots=" << pcrSlots[0] << ',' << pcrSlots[1] << ',' << pcrSlots[2]
                        << " real=" << realFirst150 << " null=" << nullFirst150 << "\n";
              return 0;
          }
          EOF
          g++ -std=c++17 -pthread -Isrc /tmp/test_wisi_segment.cpp src/media/CbrTsPacer.cpp -o /tmp/test_wisi_segment
          /tmp/test_wisi_segment
