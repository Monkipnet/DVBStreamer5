name: Fix zero-copy integration runner

on:
  push:
    paths:
      - .github/workflows/fix-zero-copy-integration-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix installer runtime patch in integration workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-nvidia-zero-copy-integration.yml')
          s = p.read_text()
          marker = "                'installer runtime')"
          b = s.index(marker)
          a = s.rfind("          exact('scripts/install_native_hw_backends.sh',", 0, b)
          end = b + len(marker)
          replacement = '''          p = Path('scripts/install_native_hw_backends.sh')
          s = p.read_text()
          old = 'libnvidia-encode|libcuda'
          if s.count(old) != 1:
              raise SystemExit(f'installer runtime: matches={s.count(old)}')
          p.write_text(s.replace(old, 'libnvidia-encode|libnvcuvid|libcuda'))'''
          p.write_text(s[:a] + replacement + s[end:])
          PY
          git diff --check
          git config user.name "DVBStreamer5 automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/apply-nvidia-zero-copy-integration.yml
          git commit -m "Fix zero-copy integration installer patch"
          git push origin HEAD:main
