name: Apply V10.8.86 remove OnDemand startup grace

on:
  push:
    branches:
      - work/v10.8.86-remove-ondemand-grace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/media/NativeHlsInput.cpp',
              '''    Playlist playlist;\n    // V10.8.84: an OnDemand upstream can itself need time to wake and publish\n    // its first media playlist. Keep retrying while it warms instead of\n    // declaring the relay dead after the normal 15-second online timeout.\n    const bool onDemandStartup = lower(config_.activationMode) == "ondemand";\n    const auto startupGrace = onDemandStartup\n        ? std::chrono::seconds(45)\n        : std::chrono::seconds(15);\n    const auto startupDeadline = Clock::now() + startupGrace;\n    if (onDemandStartup) {\n        std::cerr << "NATIVE HLS INPUT STARTUP"\n                  << " stream=" << config_.name\n                  << " mode=ondemand grace_s=" << startupGrace.count()\n                  << std::endl;\n    }\n    while (!stopping_.load() && !loadPlaylist(playlist)) {''',
              '''    Playlist playlist;\n    const auto startupDeadline = Clock::now() + std::chrono::seconds(15);\n    while (!stopping_.load() && !loadPlaylist(playlist)) {''',
              'restore HLS 15-second startup timeout')

          replace_once(
              'src/StreamManager.h',
              '''    std::set<std::string> onDemandStartedStreams;\n    std::map<std::string, std::chrono::steady_clock::time_point> onDemandLastActivity;\n    // V10.8.84: keep a distinct activation timestamp so a slow IP/HLS source\n    // gets a startup grace without extending the normal post-view idle timeout.\n    std::map<std::string, std::chrono::steady_clock::time_point> onDemandStartedAt;''',
              '''    std::set<std::string> onDemandStartedStreams;\n    std::map<std::string, std::chrono::steady_clock::time_point> onDemandLastActivity;''',
              'remove OnDemand activation timestamp')

          replace_once(
              'src/StreamManager.cpp',
              '''    onDemandStartedStreams.insert(id);\n    onDemandStartedAt[id] = std::chrono::steady_clock::now();\n    std::cerr << "ONDEMAND ACTIVATE stream=" << id''',
              '''    onDemandStartedStreams.insert(id);\n    std::cerr << "ONDEMAND ACTIVATE stream=" << id''',
              'remove activation timestamp recording')

          replace_once(
              'src/StreamManager.cpp',
              '''void StreamManager::monitorOnDemandStreams() {\n    // HLS clients fetch short-lived playlist/segment resources rather than keeping\n    // a persistent socket open. Keep the normal 10-second post-view idle timeout,\n    // but protect a newly activated OnDemand IP source while its upstream wakes.\n    constexpr auto kIdleGrace = std::chrono::seconds(10);\n    constexpr auto kStartupGrace = std::chrono::seconds(45);''',
              '''void StreamManager::monitorOnDemandStreams() {\n    // HLS clients fetch short-lived playlist/segment resources rather than keeping\n    // a persistent socket open. Ten seconds was too aggressive and could stop an\n    // actively watched channel between requests, producing visible HLS stalls.\n    constexpr auto kIdleGrace = std::chrono::seconds(10);''',
              'remove 45-second monitor startup grace')

          replace_once(
              'src/StreamManager.cpp',
              '''            if (!stillOnDemand) {\n                onDemandLastActivity.erase(id);\n                onDemandStartedAt.erase(id);\n                it = onDemandStartedStreams.erase(it);\n                continue;\n            }''',
              '''            if (!stillOnDemand) {\n                onDemandLastActivity.erase(id);\n                it = onDemandStartedStreams.erase(it);\n                continue;\n            }''',
              'remove mode-change startup timestamp cleanup')

          replace_once(
              'src/StreamManager.cpp',
              '''            const auto activity = onDemandLastActivity.find(id);\n            const bool recentActivity = activity != onDemandLastActivity.end() &&\n                now - activity->second < kIdleGrace;\n            const auto started = onDemandStartedAt.find(id);\n            const bool startupProtected = started != onDemandStartedAt.end() &&\n                now - started->second < kStartupGrace;\n            if (hasHttpClient || recentActivity || startupProtected) {\n                ++it;\n                continue;\n            }''',
              '''            const auto activity = onDemandLastActivity.find(id);\n            const bool recentActivity = activity != onDemandLastActivity.end() &&\n                now - activity->second < kIdleGrace;\n            if (hasHttpClient || recentActivity) {\n                ++it;\n                continue;\n            }''',
              'restore normal OnDemand idle decision')

          replace_once(
              'src/StreamManager.cpp',
              '''            it = onDemandStartedStreams.erase(it);\n            onDemandLastActivity.erase(id);\n            onDemandStartedAt.erase(id);\n            if (isStreamActive(id)) {''',
              '''            it = onDemandStartedStreams.erase(it);\n            onDemandLastActivity.erase(id);\n            if (isStreamActive(id)) {''',
              'remove idle startup timestamp cleanup')

          replace_once(
              'src/StreamManager.cpp',
              '''                          << " reason=no-clients idle_s=10 startup_grace_s=45" << std::endl;''',
              '''                          << " reason=no-clients idle_s=10" << std::endl;''',
              'restore OnDemand deactivate log')

          replace_once(
              'src/AppVersion.h',
              'inline constexpr const char* kProgramVersion = "10.8.85";',
              'inline constexpr const char* kProgramVersion = "10.8.86";',
              'program version')
          PY
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.86"' src/AppVersion.h
          grep -q 'startupDeadline = Clock::now() + std::chrono::seconds(15)' src/media/NativeHlsInput.cpp
          ! grep -q 'grace_s=45' src/media/NativeHlsInput.cpp
          ! grep -q 'kStartupGrace' src/StreamManager.cpp
          ! grep -q 'onDemandStartedAt' src/StreamManager.h
      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "DVBStreamer5 Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-v10886.yml
          git add src/media/NativeHlsInput.cpp src/StreamManager.cpp src/StreamManager.h src/AppVersion.h
          git commit -m "V10.8.86 remove temporary OnDemand startup grace"
          git push origin HEAD:work/v10.8.86-remove-ondemand-grace
