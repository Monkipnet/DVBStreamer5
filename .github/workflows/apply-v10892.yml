name: Apply V10.8.92 HLS startup activity hold
on:
  push:
    branches:
      - work/v10.8.91-hls-generation-guard
    paths:
      - '.github/workflows/apply-v10892.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8.91-hls-generation-guard
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: python3 tools/apply_v10892.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'hls-startup-wait' src/HttpServer.cpp
          grep -q 'kProgramVersion = "10.8.92"' src/AppVersion.h
      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-v10892.yml tools/apply_v10892.py
          git add src/HttpServer.cpp src/AppVersion.h
          git commit -m 'V10.8.92 keep OnDemand alive during HLS startup wait'
          git push origin HEAD:work/v10.8.91-hls-generation-guard
