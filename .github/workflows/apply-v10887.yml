name: Apply V10.8.87 H26x clean start

on:
  push:
    branches:
      - work/v10.8.87-h26x-clean-start

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          old = '''                    const bool mpeg12Video = streamType == 0x01U || streamType == 0x02U;\n                    if (mpeg12Video) {\n                        if (off + 9U > packet.size()) return true;\n                        const std::size_t elementary =\n                            off + 9U + static_cast<std::size_t>(packet[off + 8U]);\n                        if (elementary + 4U > packet.size()) return true;\n\n                        bool sequenceHeader = false;\n                        for (std::size_t pos = elementary; pos + 4U <= packet.size(); ++pos) {\n                            if (packet[pos] == 0x00U && packet[pos + 1U] == 0x00U &&\n                                packet[pos + 2U] == 0x01U && packet[pos + 3U] == 0xb3U) {\n                                sequenceHeader = true;\n                                break;\n                            }\n                        }\n                        if (!sequenceHeader) return true;\n                    }'''

          new = '''                    const bool mpeg12Video = streamType == 0x01U || streamType == 0x02U;\n                    if (mpeg12Video) {\n                        if (off + 9U > packet.size()) return true;\n                        const std::size_t elementary =\n                            off + 9U + static_cast<std::size_t>(packet[off + 8U]);\n                        if (elementary + 4U > packet.size()) return true;\n\n                        bool sequenceHeader = false;\n                        for (std::size_t pos = elementary; pos + 4U <= packet.size(); ++pos) {\n                            if (packet[pos] == 0x00U && packet[pos + 1U] == 0x00U &&\n                                packet[pos + 2U] == 0x01U && packet[pos + 3U] == 0xb3U) {\n                                sequenceHeader = true;\n                                break;\n                            }\n                        }\n                        if (!sequenceHeader) return true;\n                    } else if (streamType == 0x1bU || streamType == 0x24U) {\n                        // V10.8.87: AVC/HEVC must not start the first HLS segment\n                        // on slices that reference parameter sets the fresh decoder\n                        // has never seen. Admit the first PES only when its first\n                        // TS packet carries the codec parameter sets in Annex-B form.\n                        if (off + 9U > packet.size()) return true;\n                        const std::size_t elementary =\n                            off + 9U + static_cast<std::size_t>(packet[off + 8U]);\n                        if (elementary + 4U > packet.size()) return true;\n\n                        bool haveVps = false;\n                        bool haveSps = false;\n                        bool havePps = false;\n                        for (std::size_t pos = elementary; pos + 4U <= packet.size(); ++pos) {\n                            std::size_t nal = packet.size();\n                            if (packet[pos] == 0x00U && packet[pos + 1U] == 0x00U &&\n                                packet[pos + 2U] == 0x01U) {\n                                nal = pos + 3U;\n                            } else if (pos + 5U <= packet.size() &&\n                                       packet[pos] == 0x00U && packet[pos + 1U] == 0x00U &&\n                                       packet[pos + 2U] == 0x00U && packet[pos + 3U] == 0x01U) {\n                                nal = pos + 4U;\n                            }\n                            if (nal >= packet.size()) continue;\n\n                            if (streamType == 0x1bU) {\n                                const std::uint8_t nalType = packet[nal] & 0x1fU;\n                                if (nalType == 7U) haveSps = true;\n                                else if (nalType == 8U) havePps = true;\n                            } else {\n                                const std::uint8_t nalType = (packet[nal] >> 1U) & 0x3fU;\n                                if (nalType == 32U) haveVps = true;\n                                else if (nalType == 33U) haveSps = true;\n                                else if (nalType == 34U) havePps = true;\n                            }\n                        }\n\n                        const bool decoderConfigReady = streamType == 0x1bU\n                            ? (haveSps && havePps)\n                            : (haveVps && haveSps && havePps);\n                        if (!decoderConfigReady) return true;\n                    }'''
          replace_once('src/media/NativeHlsSegmenter.cpp', old, new, 'H26x clean-start gate')

          replace_once(
              'src/AppVersion.h',
              'inline constexpr const char* kProgramVersion = "10.8.86";',
              'inline constexpr const char* kProgramVersion = "10.8.87";',
              'program version')
          PY
      - name: Validate patch
        shell: bash
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.87"' src/AppVersion.h
          grep -q 'streamType == 0x1bU || streamType == 0x24U' src/media/NativeHlsSegmenter.cpp
          grep -q 'decoderConfigReady' src/media/NativeHlsSegmenter.cpp
      - name: Commit patched tree
        shell: bash
        run: |
          git config user.name "DVBStreamer5 Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-v10887.yml
          git add src/media/NativeHlsSegmenter.cpp src/AppVersion.h
          git commit -m "V10.8.87 wait for H264 H265 parameter sets at HLS start"
          git push origin HEAD:work/v10.8.87-h26x-clean-start
