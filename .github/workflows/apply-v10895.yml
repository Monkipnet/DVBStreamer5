name: Apply V10.8.95 H26x config prefix
on:
  push:
    paths:
      - '.github/apply-v10895.py'
      - '.github/workflows/apply-v10895.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v10.8.95-h26x-config-prefix
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply-v10895.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.95"' src/AppVersion.h
          grep -q 'h26xParameterSets_' src/media/NativeHlsSegmenter.h
          grep -q 'extractH26xParameterSets' src/media/NativeHlsSegmenter.cpp
          grep -q 'writeH26xConfigPrefix' src/media/NativeHlsSegmenter.cpp
      - name: C++ syntax check
        run: g++ -std=c++20 -Isrc -fsyntax-only src/media/NativeHlsSegmenter.cpp
      - name: Commit patched tree
        run: |
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/AppVersion.h src/media/NativeHlsSegmenter.h src/media/NativeHlsSegmenter.cpp
          git commit -m 'V10.8.95 repeat H26x decoder config at HLS boundaries'
          git push origin HEAD:work/v10.8.95-h26x-config-prefix
