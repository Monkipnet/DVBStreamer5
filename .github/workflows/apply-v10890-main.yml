name: Apply V10.8.90 HLS startup wait
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v10890-main.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_v10890_temp.py
      - name: Validate
        run: |
          git diff --check
          grep -n 'attempt < 120' src/HttpServer.cpp
          grep -n 'kProgramVersion = "10.8.90"' src/AppVersion.h
      - name: Commit clean result
        run: |
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-v10890-main.yml scripts/apply_v10890_temp.py
          git add src/HttpServer.cpp src/AppVersion.h
          git commit -m 'V10.8.90 wait longer for decoder-safe OnDemand HLS startup'
          git push origin HEAD:main
