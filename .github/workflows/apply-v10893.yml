name: Apply V10.8.93 IDR boundaries
on:
  push:
    branches:
      - work/v10.8.93-idr-boundaries
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply-v10893.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.93"' src/AppVersion.h
          grep -q 'h26xSafeBoundary = haveRandomAccess;' src/media/NativeHlsSegmenter.cpp
          git diff -- src/AppVersion.h src/media/NativeHlsSegmenter.cpp
      - name: Commit patched tree
        run: |
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/AppVersion.h src/media/NativeHlsSegmenter.cpp
          git commit -m 'V10.8.93 rotate passthrough H26x HLS on keyframes'
          git push
