name: wisi-cbr-v171-test

on:
  push:
    branches:
      - wisi-cbr-v171

permissions:
  contents: read

jobs:
  syntax-and-sender:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply V171 candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/media/WisiCbrOutputWorker.h')
          s = p.read_text()
          s = s.replace('#include <cerrno>\n#include <ctime>\n', '#include <cerrno>\n#include <ctime>\n#include <pthread.h>\n#include <sched.h>\n', 1)
          marker = '''#ifndef _WIN32\n    static std::uint64_t monotonicNanoseconds() noexcept {'''
          repl = '''#ifndef _WIN32\n    void configureSenderScheduling() noexcept {\n        sched_param parameters {};\n        parameters.sched_priority = 1;\n        const int result = ::pthread_setschedparam(\n            ::pthread_self(), SCHED_FIFO, &parameters);\n        if (result == 0) {\n            std::cerr << "WISI CBR sender scheduling index=" << outputIndex_\n                      << " policy=SCHED_FIFO priority=1" << std::endl;\n        } else {\n            std::cerr << "WISI CBR sender scheduling index=" << outputIndex_\n                      << " policy=CFS fallback_error=" << result << std::endl;\n        }\n    }\n\n    static std::uint64_t monotonicNanoseconds() noexcept {'''
          if marker not in s:
              raise SystemExit('linux helper marker missing')
          s = s.replace(marker, repl, 1)
          marker = '''#else\n    static void sleepUntil(std::chrono::steady_clock::time_point deadline) noexcept {'''
          repl = '''#else\n    void configureSenderScheduling() noexcept {}\n\n    static void sleepUntil(std::chrono::steady_clock::time_point deadline) noexcept {'''
          if marker not in s:
              raise SystemExit('windows helper marker missing')
          s = s.replace(marker, repl, 1)
          marker = '''    void senderLoop() noexcept {\n        try {\n            bool startupComplete = false;'''
          repl = '''    void senderLoop() noexcept {\n        try {\n            configureSenderScheduling();\n            bool startupComplete = false;'''
          if marker not in s:
              raise SystemExit('senderLoop marker missing')
          s = s.replace(marker, repl, 1)
          old = '''                const auto wokeAt = std::chrono::steady_clock::now();\n                lock.lock();\n                if (stopping_ || !relayRunning_->load(std::memory_order_acquire)) break;\n\n                mpegts::CbrDatagram datagram {};\n                const std::size_t queuedBefore = pacer_.queuedPackets();\n                const std::size_t readySegmentsBefore = pacer_.readySegments();\n                const bool timingLockedBefore = pacer_.timingLocked();\n                if (!pacer_.nextDatagram(wokeAt, datagram)) continue;'''
          new = '''                const auto wokeAt = std::chrono::steady_clock::now();\n                lock.lock();\n                const auto sendReadyAt = std::chrono::steady_clock::now();\n                if (stopping_ || !relayRunning_->load(std::memory_order_acquire)) break;\n\n                mpegts::CbrDatagram datagram {};\n                const std::size_t queuedBefore = pacer_.queuedPackets();\n                const std::size_t readySegmentsBefore = pacer_.readySegments();\n                const bool timingLockedBefore = pacer_.timingLocked();\n                if (!pacer_.nextDatagram(sendReadyAt, datagram)) continue;'''
          if old not in s:
              raise SystemExit('wake/lock block missing')
          s = s.replace(old, new, 1)
          old = '''                if (wokeAt > deadline) {\n                    const auto lateNs = std::chrono::duration_cast<std::chrono::nanoseconds>(\n                        wokeAt - deadline).count();'''
          new = '''                if (firstSendLogged_ && sendReadyAt > deadline) {\n                    const auto lateNs = std::chrono::duration_cast<std::chrono::nanoseconds>(\n                        sendReadyAt - deadline).count();'''
          if old not in s:
              raise SystemExit('late block missing')
          s = s.replace(old, new, 1)
          old = '''                        lateMaxUs_ = (std::max<std::uint64_t>)(\n                            lateMaxUs_, static_cast<std::uint64_t>(lateNs) / 1000ULL);\n                        const auto now = std::chrono::steady_clock::now();'''
          new = '''                        const std::uint64_t currentLateUs =\n                            static_cast<std::uint64_t>(lateNs) / 1000ULL;\n                        const auto lockWaitNs = std::chrono::duration_cast<std::chrono::nanoseconds>(\n                            sendReadyAt - wokeAt).count();\n                        const std::uint64_t currentLockWaitUs = lockWaitNs > 0\n                            ? static_cast<std::uint64_t>(lockWaitNs) / 1000ULL\n                            : 0ULL;\n                        lateMaxUs_ = (std::max<std::uint64_t>)(lateMaxUs_, currentLateUs);\n                        const auto now = std::chrono::steady_clock::now();'''
          if old not in s:
              raise SystemExit('late metrics block missing')
          s = s.replace(old, new, 1)
          old = '''                            std::cerr << "WISI CBR LATE index=" << outputIndex_\n                                      << " late_events=" << lateEvents_\n                                      << " max_late_us=" << lateMaxUs_\n                                      << " queued_kb=" << (pacer_.queuedBytes() / 1024U)'''
          new = '''                            std::cerr << "WISI CBR LATE index=" << outputIndex_\n                                      << " late_events=" << lateEvents_\n                                      << " current_late_us=" << currentLateUs\n                                      << " current_lock_wait_us=" << currentLockWaitUs\n                                      << " max_late_us=" << lateMaxUs_\n                                      << " queued_kb=" << (pacer_.queuedBytes() / 1024U)'''
          if old not in s:
              raise SystemExit('late log block missing')
          s = s.replace(old, new, 1)
          s = s.replace('                              << " source_pcr=preserved"\n                              << " pcr_schedule=exact-segments"', '                              << " source_pcr=restamped"\n                              << " pcr_schedule=output-cbr-slot-clock"', 1)
          p.write_text(s)

          v = Path('src/AppVersion.h')
          vs = v.read_text()
          if '10.8.170' not in vs:
              raise SystemExit('V170 version not found')
          v.write_text(vs.replace('10.8.170', '10.8.171', 1))
          PY

      - name: Diff check
        run: git diff --check

      - name: Syntax check
        run: |
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_header.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_header.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: Verify V171 changes
        run: |
          grep -q 'SCHED_FIFO' src/media/WisiCbrOutputWorker.h
          grep -q 'current_late_us=' src/media/WisiCbrOutputWorker.h
          grep -q 'current_lock_wait_us=' src/media/WisiCbrOutputWorker.h
          grep -q 'source_pcr=restamped' src/media/WisiCbrOutputWorker.h
          grep -q '10.8.171' src/AppVersion.h
