name: V10.8.62 Remote Newcamd reader UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v10862-remote-newcamd-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 scripts/patch_v10862_status_pattern.py
          python3 scripts/apply_v10862_remote_newcamd_ui.py

      - name: Validate source and embedded UI
        shell: bash
        run: |
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjsoncpp-dev
          g++ -std=c++17 -fsyntax-only -Isrc -I/usr/include/jsoncpp src/OscamMiniManager.cpp
          python3 -c "from pathlib import Path; s=Path('src/OscamMiniManager.cpp').read_text(); Path('/tmp/oscam-mini-ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/oscam-mini-ui.js

      - name: Commit V10.8.62
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-v10862-remote-newcamd-ui.yml
          rm -f scripts/apply_v10862_remote_newcamd_ui.py scripts/patch_v10862_status_pattern.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add -A
          git status --short
          git commit -m 'V10.8.62 add Remote Newcamd readers to OSCam-mini UI'
          git push origin HEAD:main
