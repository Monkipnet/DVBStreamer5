name: V10.8.60 Newcamd plugin and unlimited services

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v10860-newcamd-unlimited.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V10.8.60
        shell: bash
        run: |
          cat > /tmp/apply_v10860.py <<'PY'
          from pathlib import Path

          def rep(text, old, new, label, expected=1):
              got = text.count(old)
              if got != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, got {got}")
              return text.replace(old, new)

          p = Path('CMakeLists.txt')
          s = p.read_text()
          anchor = "target_link_libraries(DVBStreamer5\n    dvbstreamer5_boost_headers\n    dvbstreamer5_media_core\n    dvbstreamer5_jsoncpp\n    dvbstreamer5_dvbcsa\n    OpenSSL::Crypto\n    pthread\n    dl\n)\n"
          s = rep(s, anchor, anchor + "# Newcamd is mandatory runtime content; building DVBStreamer5 also builds the plugin.\nadd_dependencies(DVBStreamer5 dvbstreamer5_ca_newcamd)\n\n", 'CMake dependency')
          s = rep(s, "install(TARGETS DVBStreamer5 RUNTIME DESTINATION bin)\n", "install(TARGETS DVBStreamer5 RUNTIME DESTINATION bin)\ninstall(TARGETS dvbstreamer5_ca_newcamd LIBRARY DESTINATION ca-plugins)\n", 'CMake plugin install')
          p.write_text(s)

          p = Path('scripts/make_portable_linux_bundle.sh')
          s = p.read_text()
          old = "mapfile -t PLUGINS < <(find \"$BUILD_DIR\" -type f -name 'dvbstreamer5-ca-*.so' -print 2>/dev/null | sort -u)\nfor plugin in \"${PLUGINS[@]}\"; do\n    install -m 0644 \"$plugin\" \"$STAGE/ca-plugins/$(basename -- \"$plugin\")\"\ndone\n"
          new = "mapfile -t PLUGINS < <(find \"$BUILD_DIR\" -type f -name 'dvbstreamer5-ca-*.so' -print 2>/dev/null | sort -u)\nNEWCAMD_PLUGIN=\"\"\nfor plugin in \"${PLUGINS[@]}\"; do\n    if [[ \"$(basename -- \"$plugin\")\" == \"dvbstreamer5-ca-newcamd.so\" ]]; then NEWCAMD_PLUGIN=\"$plugin\"; fi\n    install -m 0644 \"$plugin\" \"$STAGE/ca-plugins/$(basename -- \"$plugin\")\"\ndone\n[[ -n \"$NEWCAMD_PLUGIN\" ]] || fail \"mandatory Newcamd plugin was not built: $BUILD_DIR/ca-plugins/dvbstreamer5-ca-newcamd.so\"\nreadelf -Ws \"$NEWCAMD_PLUGIN\" | grep -q 'dvbstreamer5_ca_backend_get_api_v1' || fail \"Newcamd plugin is missing dvbstreamer5_ca_backend_get_api_v1 entry point\"\n"
          s = rep(s, old, new, 'bundle plugin requirement')
          p.write_text(s)

          p = Path('src/CaBackend.cpp')
          s = p.read_text()
          old = "    passthrough.builtin = true;\n    passthrough.usable = true;\n    backends_.emplace(passthrough.id, std::move(passthrough));\n}\n"
          new = "    passthrough.builtin = true;\n    passthrough.usable = true;\n    backends_.emplace(passthrough.id, std::move(passthrough));\n\n    // Discover external CA backends immediately so Newcamd is visible before client refresh.\n    loadPluginsLocked();\n}\n"
          s = rep(s, old, new, 'startup plugin discovery')
          p.write_text(s)

          p = Path('src/ConfigManager.h')
          s = rep(p.read_text(), "    unsigned maxServices = 10;\n", "    unsigned maxServices = 0; // 0 = unlimited\n", 'config default')
          p.write_text(s)

          p = Path('src/ConfigManager.cpp')
          s = p.read_text()
          s = rep(s, "    config.maxServices = std::clamp(root.get(\"max_services\", 10).asUInt(), 1u, 64u);\n", "    config.maxServices = 0; // no software decoded-service cap\n", 'config load cap')
          s = rep(s, "    root[\"max_services\"] = std::clamp(maxServices, 1u, 64u);\n", "    root[\"max_services\"] = 0;\n", 'config save cap')
          p.write_text(s)

          p = Path('src/CardManager.h')
          s = p.read_text()
          s = rep(s, "    static constexpr unsigned kDefaultMaxServices = 10;\n    static constexpr unsigned kMaxConfigurableServices = 64;\n", "    static constexpr unsigned kDefaultMaxServices = 0; // unlimited\n    static constexpr unsigned kMaxConfigurableServices = 0; // no software cap\n", 'manager constants')
          p.write_text(s)

          p = Path('src/CardManager.cpp')
          s = p.read_text()
          s = rep(s, "        client.maxServices = std::clamp(client.maxServices, 1u, kMaxConfigurableServices);\n", "        client.maxServices = 0;\n", 'configure cap')
          s = rep(s, "    item[\"max_services\"] = std::clamp(client.maxServices, 1u, kMaxConfigurableServices);\n", "    item[\"max_services\"] = 0;\n    item[\"unlimited_services\"] = true;\n", 'status cap')
          s = rep(s, "    client.maxServices = std::clamp(client.maxServices, 1u, kMaxConfigurableServices);\n", "    client.maxServices = 0;\n", 'reserve cap')
          s = rep(s, "    if (used >= client.maxServices) {\n", "    if (client.maxServices != 0 && used >= client.maxServices) {\n", 'reserve guard')
          s = rep(s, "    root[\"max_configurable_services\"] = kMaxConfigurableServices;\n", "    root[\"max_configurable_services\"] = 0;\n    root[\"service_limit_enabled\"] = false;\n", 'snapshot cap')
          old = "        const unsigned maxServices = item.get(\"max_services\", kDefaultMaxServices).asUInt();\n        const unsigned used = services.size();\n        item[\"services\"] = services;\n        item[\"services_used\"] = used;\n        item[\"services_active\"] = active;\n        item[\"services_free\"] = maxServices > used ? maxServices - used : 0;\n"
          new = "        const unsigned used = services.size();\n        item[\"services\"] = services;\n        item[\"services_used\"] = used;\n        item[\"services_active\"] = active;\n        item[\"services_free\"] = 0;\n        item[\"unlimited_services\"] = true;\n"
          s = rep(s, old, new, 'services free')
          s = s.replace('              << " slots=" << (used + 1) << "/" << client.maxServices\n', '              << " slots=" << (used + 1) << " unlimited"\n')
          p.write_text(s)

          p = Path('src/ca/backends/newcamd/NewcamdPlugin.cpp')
          s = p.read_text()
          s = rep(s, "constexpr size_t kMaxSessionsPerReader = 10;\n", "constexpr size_t kMaxSessionsPerReader = 0; // 0 = unlimited\n", 'newcamd cap')
          s = rep(s, "if (activeForReader >= kMaxSessionsPerReader) {", "if (kMaxSessionsPerReader != 0 && activeForReader >= kMaxSessionsPerReader) {", 'newcamd guards', expected=2)
          s = s.replace('Newcamd per-reader service session limit reached (10)', 'Newcamd per-reader service session limit reached')
          s = s.replace('<< " session_mode=per-service max_sessions=" << kMaxSessionsPerReader', '<< " session_mode=per-service max_sessions=unlimited"')
          s = s.replace('              << "/" << kMaxSessionsPerReader\n', '              << " max_sessions=unlimited"\n')
          p.write_text(s)

          p = Path('src/AppVersion.h')
          s = rep(p.read_text(), 'kProgramVersion = "10.8.59"', 'kProgramVersion = "10.8.60"', 'version')
          p.write_text(s)

          assert 'add_dependencies(DVBStreamer5 dvbstreamer5_ca_newcamd)' in Path('CMakeLists.txt').read_text()
          assert 'mandatory Newcamd plugin was not built' in Path('scripts/make_portable_linux_bundle.sh').read_text()
          assert 'kMaxSessionsPerReader = 0' in Path('src/ca/backends/newcamd/NewcamdPlugin.cpp').read_text()
          assert 'kProgramVersion = "10.8.60"' in Path('src/AppVersion.h').read_text()
          PY
          python3 /tmp/apply_v10860.py
          git diff --check
          bash -n scripts/make_portable_linux_bundle.sh
          rm -f .github/workflows/one-shot-v10860-newcamd-unlimited.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add -A
          git status --short
          git commit -m 'V10.8.60 make Newcamd mandatory and remove service caps'
          git push origin HEAD:main