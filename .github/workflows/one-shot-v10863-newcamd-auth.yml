name: V10.8.63 Newcamd authentication repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v10863-newcamd-auth.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply authentication repair
        run: python3 scripts/apply_v10863_newcamd_auth.py

      - name: Validate source
        shell: bash
        run: |
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config libssl-dev \
            libpcsclite-dev pcscd pcsc-tools libjsoncpp-dev

          g++ -std=c++17 -fsyntax-only \
            -Isrc -I/usr/include/jsoncpp \
            src/OscamMiniManager.cpp

          bash scripts/build_oscam_mini.sh \
            third_party/oscam-mini \
            /tmp/oscam-mini-auth-build

          /tmp/oscam-mini-auth-build/oscam-mini -V | \
            grep -Ei 'newcamd|pcsc|reader' >/tmp/oscam-mini-v10863-features.txt
          cat /tmp/oscam-mini-v10863-features.txt

          grep -q 'kProgramVersion = "10.8.63"' src/AppVersion.h
          grep -q 'invalid credentials' third_party/oscam-mini/module-newcamd.c
          ! grep -q 'account->pwd=%s' third_party/oscam-mini/module-newcamd.c

      - name: Commit V10.8.63
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-v10863-newcamd-auth.yml
          rm -f scripts/apply_v10863_newcamd_auth.py
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add -A
          git status --short
          git commit -m 'V10.8.63 harden OSCam-mini Newcamd authentication'
          git push origin HEAD:main
