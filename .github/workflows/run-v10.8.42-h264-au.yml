name: V10.8.42 H264 AU check

on:
  push:
    paths:
      - .github/workflows/run-v10.8.42-h264-au.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-v10.8.42-h264-au
          fetch-depth: 0

      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 .github/v10.8.42_apply.py
          git diff --check
          grep -q 'kProgramVersion = "10.8.42"' src/AppVersion.h
          grep -q 'NATIVE AVC AU DIAG' src/media/NativeCodecVendored.cpp

      - name: Prepare native codecs
        run: |
          set -euo pipefail
          ./scripts/vendor_native_codecs.sh
          DVBSTREAMER5_CODEC_JOBS=2 ./scripts/build_native_codecs.sh

      - name: Syntax check media code
        run: |
          set -euo pipefail
          PREFIX="$PWD/third_party/native-codecs-prefix"
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -Isrc -I"$PREFIX/include" -fsyntax-only src/media/NativeCodecVendored.cpp
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -Isrc -fsyntax-only src/media/NativeTranscoderPipeline.cpp

      - name: Commit production patch
        run: |
          set -euo pipefail
          git config user.name "DVBStreamer5 automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/AppVersion.h src/media/NativeCodecVendored.cpp
          git commit -m "V10.8.42 reassemble H264 access units across PES"
          git push origin HEAD:stage-v10.8.42-h264-au
