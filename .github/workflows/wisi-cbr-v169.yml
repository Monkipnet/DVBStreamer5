name: wisi-cbr-v169

on:
  push:
    branches:
      - wisi-cbr-v169

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V169
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/media/CbrTsPacer.cpp')
          s = p.read_text()
          old = '''    // Never repay scheduler latency with a burst. Physical WISI CBR is always
    // one 1316-byte datagram per transport deadline.
    const std::uint64_t periodNs =
        (kDatagramBits * kNanosecondsPerSecond) / targetBitrate_;
    const auto maximumCatchup = std::chrono::nanoseconds(
        (std::max<std::uint64_t>)(periodNs, 1ULL));
    if (now - nextDeadline_ >= maximumCatchup) {
        nextDeadline_ = now;
        pacingRemainder_ = 0;
    }
'''
          new = '''    // V169: never repay even sub-period scheduler latency. A strict hardware
    // receiver such as WISI measures those shortened inter-datagram gaps as
    // brief transport-rate overshoot (for example 4.0 -> 4.3 Mbit/s). Rebase
    // the physical CBR clock after every late wakeup so the next 1316-byte UDP
    // datagram is never intentionally scheduled early to catch up phase.
    if (now > nextDeadline_) {
        nextDeadline_ = now;
        pacingRemainder_ = 0;
    }
'''
          if old not in s:
              raise SystemExit('V169 pacing block not found')
          p.write_text(s.replace(old, new, 1))

          v = Path('src/AppVersion.h')
          vs = v.read_text()
          if '10.8.168' not in vs:
              raise SystemExit('V168 version not found')
          v.write_text(vs.replace('10.8.168', '10.8.169', 1))
          PY

      - name: Diff and syntax check
        run: |
          git diff --check
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
          cat >/tmp/wisi_header.cpp <<'EOF'
          #include "media/WisiCbrOutputWorker.h"
          int main() { return 0; }
          EOF
          g++ -std=c++17 -pthread -Isrc -fsyntax-only /tmp/wisi_header.cpp
          g++ -std=c++17 -pthread -Isrc -fsyntax-only src/media/NativeUdpRelay.cpp

      - name: No sub-period catch-up test
        run: |
          cat >/tmp/test_v169.cpp <<'EOF'
          #include "media/CbrTsPacer.h"
          #include <cassert>
          #include <chrono>
          #include <cstdint>
          #include <iostream>
          using namespace dvbstreamer5::media::mpegts;
          static Packet packet() {
              Packet p{}; p.fill(0xff); p[0]=kSyncByte; p[1]=0x01; p[2]=0x00; p[3]=0x10; return p;
          }
          int main() {
              constexpr std::uint64_t rate=4000000ULL;
              constexpr std::uint64_t bits=7ULL*188ULL*8ULL;
              constexpr std::uint64_t expectedNs=bits*1000000000ULL/rate;
              CbrTsPacer p(rate);
              assert(p.enqueue(packet()));
              const auto d0=p.nextDeadline();
              const auto late=d0+std::chrono::microseconds(200);
              CbrDatagram out{};
              assert(p.nextDatagram(late,out));
              const auto d1=p.nextDeadline();
              const auto gap=std::chrono::duration_cast<std::chrono::nanoseconds>(d1-late).count();
              assert(gap >= static_cast<long long>(expectedNs));
              assert(gap <= static_cast<long long>(expectedNs+1));
              std::cout << "expected_ns=" << expectedNs << " next_gap_ns=" << gap << "\n";
              return 0;
          }
          EOF
          g++ -std=c++17 -pthread -Isrc /tmp/test_v169.cpp src/media/CbrTsPacer.cpp -o /tmp/test_v169
          /tmp/test_v169

      - name: Commit clean V169 tree
        run: |
          git config user.name "Vitali Lukomski"
          git config user.email "monkipnet@yandex.ru"
          git rm .github/workflows/wisi-cbr-v169.yml
          git add src/AppVersion.h src/media/CbrTsPacer.cpp
          git commit -m "V10.8.169 remove sub-period WISI CBR catch-up"
          git push origin HEAD:wisi-cbr-v169
