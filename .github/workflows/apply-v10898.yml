name: Apply V10.8.98 H26x video-first startup
on:
  push:
    branches:
      - work/v10.8.98-h26x-video-first-start
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply-v10898.py
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'kProgramVersion = "10.8.98"' src/AppVersion.h
          grep -q 'V10.8.98: for passthrough AVC/HEVC' src/media/NativeHlsSegmenter.cpp
          grep -q 'waitingForFirstH26xMedia' src/media/NativeHlsSegmenter.cpp
      - name: C++ syntax check
        run: |
          g++ -std=c++17 -fsyntax-only -Isrc src/media/NativeHlsSegmenter.cpp
      - name: Commit patched tree
        run: |
          git config user.name 'DVBStreamer5 Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/AppVersion.h src/media/NativeHlsSegmenter.cpp
          git commit -m 'V10.8.98 start passthrough HLS with H26x video first'
          git push origin HEAD:work/v10.8.98-h26x-video-first-start
