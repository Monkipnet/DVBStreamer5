name: V10.8.71 on-demand channel patch

on:
  push:
    branches:
      - staging/v10.8.71-ondemand
    paths:
      - .github/workflows/v10_8_71_ondemand_patch.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging/v10.8.71-ondemand

      - name: Repair patch-script C++ escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_v10_8_71_ondemand.py')
          s = p.read_text()
          marker = "    '''bool HttpServer::handleHttpStream(tcp::socket& socket, const std::string& target) {\n"
          first = s.find(marker)
          second = s.find(marker, first + 1) if first >= 0 else -1
          if second < 0:
              raise SystemExit('second handleHttpStream replacement string not found')
          s = s[:second] + "    r'''bool HttpServer::handleHttpStream(tcp::socket& socket, const std::string& target) {\n" + s[second + len(marker):]
          p.write_text(s)
          PY

      - name: Apply source patch
        run: python3 scripts/apply_v10_8_71_ondemand.py

      - name: Install syntax-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libssl-dev libcrypt-dev libjsoncpp-dev

      - name: Validate source and embedded JavaScript
        run: |
          git diff --check
          g++ -std=c++17 -pthread -fsyntax-only -Isrc -Ithird_party -Ithird_party/boost src/ConfigManager.cpp
          g++ -std=c++17 -pthread -fsyntax-only -Isrc -Ithird_party -Ithird_party/boost src/main.cpp
          g++ -std=c++17 -pthread -fsyntax-only -Isrc -Ithird_party -Ithird_party/boost src/StreamManager.cpp
          g++ -std=c++17 -pthread -fsyntax-only -Isrc -Ithird_party -Ithird_party/boost src/HttpServer.cpp
          python3 -c "from pathlib import Path; t=Path('src/HttpServer.cpp').read_text(); a=t.index('<script>')+len('<script>'); b=t.index('</script>',a); Path('/tmp/dvbstreamer5-ui.js').write_text(t[a:b])"
          node --check /tmp/dvbstreamer5-ui.js

      - name: Commit validated source patch
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppVersion.h src/ConfigManager.h src/ConfigManager.cpp src/main.cpp src/StreamManager.h src/StreamManager.cpp src/HttpServer.cpp
          git diff --cached --check
          git commit -m "V10.8.71 add on-demand channel decoding"
          git push origin HEAD:staging/v10.8.71-ondemand
