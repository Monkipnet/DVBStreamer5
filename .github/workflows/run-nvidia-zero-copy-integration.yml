name: V10.8.40 Intel zero-copy source integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-nvidia-zero-copy-integration.yml

permissions:
  contents: write

jobs:
  integrate-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-v10.8.40-intel-zero-copy
          fetch-depth: 0

      - name: Install oneVPL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvpl-dev

      - name: Integrate V10.8.40
        run: |
          python3 .github/scripts/v10_8_40_patch.py
          python3 -c 'from pathlib import Path; p=Path("src/media/NativeIntelZeroCopy.cpp"); s=p.read_text(); s=s.replace("        outputPicStruct_ = config_.deinterlace\n            ? MFX_PICSTRUCT_PROGRESSIVE\n            : (info.PicStruct ? info.PicStruct : MFX_PICSTRUCT_PROGRESSIVE);\n", "        outputPicStruct_ = config_.deinterlace\n            ? static_cast<mfxU16>(MFX_PICSTRUCT_PROGRESSIVE)\n            : (info.PicStruct != 0\n                ? info.PicStruct\n                : static_cast<mfxU16>(MFX_PICSTRUCT_PROGRESSIVE));\n"); s=s.replace("        bitstream.TimeStamp = hasPts\n            ? static_cast<mfxU64>(pts90k)\n            : MFX_TIMESTAMP_UNKNOWN;\n", "        bitstream.TimeStamp = hasPts\n            ? static_cast<mfxU64>(pts90k)\n            : std::numeric_limits<mfxU64>::max();\n"); s=s.replace("        encoded.hasPts = bitstream.TimeStamp != MFX_TIMESTAMP_UNKNOWN;\n", "        encoded.hasPts = bitstream.TimeStamp != std::numeric_limits<mfxU64>::max();\n"); p.write_text(s)'
          git diff --check

      - name: Syntax compile Intel zero-copy
        run: |
          mkdir -p /tmp/dvb-check
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-deprecated-declarations \
              -DDVBSTREAMER5_HAVE_VPL=1 -Isrc \
              -c src/media/NativeIntelZeroCopy.cpp \
              -o /tmp/dvb-check/NativeIntelZeroCopy-vpl.o
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
              -c src/media/NativeIntelZeroCopy.cpp \
              -o /tmp/dvb-check/NativeIntelZeroCopy-stub.o
          g++ -std=c++17 -Wall -Wextra -Werror \
              -DDVBSTREAMER5_HAVE_VPL=1 -Isrc \
              -c src/media/NativeTranscoderPipeline.cpp \
              -o /tmp/dvb-check/NativeTranscoderPipeline.o

      - name: Commit staging integration
        run: |
          git config user.name "Monkipnet CI"
          git config user.email "actions@users.noreply.github.com"
          git add CMakeLists.txt src/AppVersion.h \
                  src/media/NativeIntelZeroCopy.cpp \
                  src/media/NativeTranscoderPipeline.h \
                  src/media/NativeTranscoderPipeline.cpp
          git commit -m "Stage 9 V10.8.40 integrate Intel QSV zero-copy pipeline"
          git push origin HEAD:stage-v10.8.40-intel-zero-copy
