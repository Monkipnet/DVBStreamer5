name: Audit V10.8.113 English UI

on:
  push:
    branches: [v10.8.113-en-ui]
    paths:
      - '.github/workflows/audit-v10.8.113-en-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit Russian UI literals
        run: python3 tools/audit_ui_translation_tmp.py
      - name: Commit audit report
        run: |
          git config user.name "Monkipnet"
          git config user.email "monkipnet@yandex.ru"
          git add UI_TRANSLATION_AUDIT.tmp
          git commit -m "Temporary English UI translation audit"
          git push origin HEAD:v10.8.113-en-ui
