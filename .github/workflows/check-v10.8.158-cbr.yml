name: Check V10.8.158 CBR

on:
  push:
    branches:
      - fix-v10.8.158-tvstreammersat5-cbr

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile CBR pacer
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            -c src/media/CbrTsPacer.cpp -o /tmp/CbrTsPacer.o
      - name: Compile native relay integration
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc \
            -c src/media/NativeUdpRelay.cpp -o /tmp/NativeUdpRelay.o
