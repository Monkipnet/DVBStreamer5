name: V161 AV sync validation
on:
  push:
    branches: [work/v161-av-sync]
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V161 transformer
        run: python3 tools/apply_v161_av_sync.py
      - name: Diff check
        run: git diff --check
      - name: Syntax check CBR core
        run: g++ -std=c++20 -Isrc -fsyntax-only src/media/CbrTsPacer.cpp
      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build project
        run: cmake --build build --parallel 2
      - name: Commit generated V161 tree
        run: |
          git config user.name Monkipnet
          git config user.email monkipnet@yandex.ru
          git add src/AppVersion.h src/media/CbrTsPacer.h src/media/CbrTsPacer.cpp
          git commit -m 'V10.8.161 slow SAT5 network PLL for A/V sync [skip ci]'
          git rm tools/apply_v161_av_sync.py .github/workflows/v161-av-sync.yml
          git commit -m 'Remove temporary V161 validation files [skip ci]'
          git push origin HEAD:work/v161-av-sync
