name: DVBStreamer5 main Linux build + portable

on:
  push:
    branches:
      - main
      - fix/dvb-source-pcr-pacing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvbstreamer5-main-linux
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 850M
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache pkg-config python3 nodejs curl ca-certificates \
            binutils nasm autoconf automake libtool file \
            libpcsclite-dev libssl-dev libcrypt-dev libmp3lame-dev \
            libcurl4-openssl-dev libxml2-dev zlib1g-dev \
            libva-dev libvpl-dev libfreetype-dev \
            libavcodec-dev libavutil-dev

      # A GitHub-hosted runner starts with an empty workspace. Restore safe
      # compiler results, not stale installed binaries. ccache verifies source
      # bytes, compiler flags, toolchain and included headers on each hit.
      - name: Restore incremental C/C++ compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: dvbstreamer5-ccache-ubuntu2404-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dvbstreamer5-ccache-ubuntu2404-

      # These pinned dependencies do not change when application C++ files
      # change. Cache their validated static libraries by the build recipes;
      # the codec build script checks its own compiler/source fingerprint.
      - name: Restore pinned native codec library cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/native-codecs-prefix
          key: dvbstreamer5-native-codecs-ubuntu2404-${{ hashFiles('scripts/build_native_codecs.sh', 'scripts/vendor_native_codecs.sh') }}

      - name: Validate DVB-T/T2 UI, terrestrial API and JavaScript syntax
        run: node tests/web/test_dvb_terrestrial_ui.js

      - name: Verify external DVB frontend ownership and safe scanning
        run: |
          c++ -std=c++17 -Wall -Wextra -I. tests/test_dvb_frontend_owners.cpp -o /tmp/dvb-owner-test
          /tmp/dvb-owner-test
          node tests/web/test_dvb_external_owners.js

      - name: Verify active DVB transponder/LOCK and HLS media evidence
        run: |
          node tests/web/test_dvb_live_transponder_v509.js

      - name: Verify iCAM multichannel CA logging policy
        run: node tests/web/test_icam_multichannel_policy.js

      - name: Verify remote authenticated admin preview isolation
        run: |
          node tests/test_admin_preview_any_ip.js
          node tests/test_preview_hls_20372.js
          node tests/test_preview_close_20368.js

      - name: Verify TSDecrypt honest decode UI policy
        run: |
          node tests/web/test_tsdecrypt_decode_ui_policy.js
          node tests/test_preview_video_frame_evidence.js
          c++ -std=c++17 -Wall -Wextra -I. tests/test_tsdecrypt_viewer_decode_gate.cpp -o /tmp/tsdecrypt-viewer-gate-test
          /tmp/tsdecrypt-viewer-gate-test

      - name: Verify BISS2 Mode 1/E UI and plugin wiring
        run: node tests/web/test_biss2_ui.js

      - name: Verify force-stop and configuration migration UI/API
        run: |
          node tests/web/test_stream_toggle_stop_policy.js
          node tests/web/test_external_config_transfer_ui.js

      - name: Verify per-channel WISI Chameleon encoder profile UI
        run: node tests/web/test_wisi_chameleon_profile_ui.js

      - name: Verify persistent UDP input filters and metrics-poll checkbox state
        run: node tests/web/test_udp_filter_persistence_v511.js

      - name: Verify DVB transponder and IP subnet tile grouping
        run: node tests/web/test_tile_input_grouping.js

      - name: Verify NVENC HLS decoder-safe IDR boundaries and mux stall diagnostics
        run: |
          node tests/web/test_nvenc_hls_keyframe_policy.js
          node tests/web/test_mux_audio_stall_policy.js

      - name: Verify signed binary update policy and UI
        run: node tests/web/test_binary_update_policy.js

      - name: Vendor and compile pinned native SRT/codec sources
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          DVBSTREAMER5_CODEC_JOBS=2 bash scripts/build_native_codecs.sh

      - name: Configure full application (FFmpeg H.264 decoder and GPU backends)
        run: |
          cmake -S . -B build-main-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDVBSTREAMER5_ENABLE_FFMPEG_AVC=ON \
            -DDVBSTREAMER5_ENABLE_NVENC=ON \
            -DDVBSTREAMER5_ENABLE_VAAPI=ON \
            -DDVBSTREAMER5_ENABLE_INTEL_QSV=ON
          grep -q '^DVBSTREAMER5_FFMPEG_FOUND:INTERNAL=1$' build-main-ci/CMakeCache.txt || {
            echo 'ERROR: FFmpeg H.264 decoder was not enabled'; exit 1;
          }

      - name: Compile DVBStreamer5 and mandatory Newcamd plugin
        run: |
          cmake --build build-main-ci --parallel 2 --target DVBStreamer5 oscam-mini dvbstreamer5_ca_tsdecrypt dvbstreamer5_ca_biss dvbstreamer5_ca_biss2
          test -s build-main-ci/ca-plugins/dvbstreamer5-ca-biss1.so
          test -s build-main-ci/ca-plugins/dvbstreamer5-ca-biss2.so
          test -x build-main-ci/DVBStreamer5
          test -s build-main-ci/ca-plugins/dvbstreamer5-ca-newcamd.so
          readelf -d build-main-ci/DVBStreamer5 | grep -q 'libavcodec.so' || {
            echo 'ERROR: FFmpeg/libavcodec is missing from the executable'; exit 1;
          }

      - name: Build and run native MPEG-TS/MP4/failover tests
        run: |
          cmake -S tests/media_core -B build-test-media-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-test-media-ci --parallel 2
          ctest --test-dir build-test-media-ci --output-on-failure
          cmake --build build-main-ci --parallel 2 --target \
            dvbstreamer5_audio_track_test \
            dvbstreamer5_video_cadence_test \
            dvbstreamer5_native_scaler_simd_test \
            dvbstreamer5_ticker_test \
            dvbstreamer5_docx_import_test \
            dvbstreamer5_source_pcr_config_test \
            dvbstreamer5_vaapi_hrd_policy_test \
            dvbstreamer5_wisi_profile_policy_test \
            dvbstreamer5_wisi_profile_config_test
          cmake --build build-main-ci --parallel 2 --target dvbstreamer5_stream_auth_test dvbstreamer5_udp_vbr_pcr_test dvbstreamer5_vbr_peak_rate_test dvbstreamer5_shared_vbr_test dvbstreamer5_hls_cache_test dvbstreamer5_http_epoll_test dvbstreamer5_stream_api_key_test
          # V474: CTest registers these targets; build before calling CTest.
          cmake --build build-main-ci --parallel 2 --target \
            dvbstreamer5_tsdecrypt_telemetry_test \
            dvbstreamer5_tsdecrypt_recovery_test \
            dvbstreamer5_tsdecrypt_ecm_pid_policy_test \
            dvbstreamer5_tsdecrypt_pid_learning_test \
            dvbstreamer5_tsdecrypt_pid_store_test \
            dvbstreamer5_tsdecrypt_cw_health_test \
            dvbstreamer5_tsdecrypt_fd_isolation_test \
            dvbstreamer5_shared_cw_broker_test \
            dvbstreamer5_biss1_test \
            dvbstreamer5_biss2_test \
            dvbstreamer5_external_config_transfer_test
          node tests/web/test_shared_cw_broker_policy.js
          node tests/web/test_biss1_ui.js
          node tests/web/test_biss2_ui.js
          node tests/web/test_stream_toggle_stop_policy.js
          node tests/web/test_external_config_transfer_ui.js
          node tests/web/test_pcr_cpu_optimization_ui.js
          node tests/web/test_cbr_profile_ui.js
          ctest --test-dir build-main-ci --output-on-failure

      - name: Build pinned iCAM TSDecrypt with restored GitHub submodules
        run: |
          git clone https://github.com/gfto/tsdecrypt.git /tmp/dvbstreamer5-tsdecrypt
          git -C /tmp/dvbstreamer5-tsdecrypt checkout --detach f4876e84cf1866645f84b93f830af67193c85f69
          bash scripts/build_tsdecrypt_icam.sh /tmp/dvbstreamer5-tsdecrypt build-main-ci
          test -x build-main-ci/tsdecrypt-icam/tsdecrypt
          strings build-main-ci/tsdecrypt-icam/tsdecrypt | grep -F "Holding recently valid ECM pid"

      - name: Report incremental compiler cache utilization
        if: always()
        run: ccache --show-stats || true

      - name: Package portable Linux x86_64 and checksums
        id: package
        run: |
          version="$(sed -n 's/.*kProgramVersion = "\([^"]*\)";.*/\1/p' src/AppVersion.h)"
          test -n "$version"
          echo "Building version ${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/make_portable_linux_bundle.sh \
            --build-dir build-main-ci \
            --binary build-main-ci/DVBStreamer5 \
            --output-dir "dist/DVBStreamer5-${version}-linux-x86_64" \
            --with-oscam \
            --with-tsdecrypt \
            --archive
          test -x "dist/DVBStreamer5-${version}-linux-x86_64/bin/tsdecrypt"
          test -s "dist/DVBStreamer5-${version}-linux-x86_64/bin/tsdecrypt.bin"
          ( cd dist && sha256sum -c "DVBStreamer5-${version}-linux-x86_64.tar.gz.sha256" )
          cp "dist/DVBStreamer5-${version}-linux-x86_64.tar.gz.sha256" dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload portable + binary for download
        uses: actions/upload-artifact@v4
        with:
          name: DVBStreamer5-${{ steps.package.outputs.version }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/SHA256SUMS.txt
            build-main-ci/DVBStreamer5
          if-no-files-found: error
          retention-days: 30
