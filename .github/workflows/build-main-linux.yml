name: DVBStreamer5 main Linux build + portable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvbstreamer5-main-linux
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config python3 nodejs curl ca-certificates \
            binutils nasm autoconf automake libtool file \
            libpcsclite-dev libssl-dev libcrypt-dev libmp3lame-dev \
            libcurl4-openssl-dev libxml2-dev zlib1g-dev \
            libva-dev libvpl-dev libfreetype-dev

      - name: Vendor and compile pinned native SRT/codec sources
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          DVBSTREAMER5_CODEC_JOBS=2 bash scripts/build_native_codecs.sh

      - name: Configure full application (no FFmpeg; keep GPU backends)
        run: |
          cmake -S . -B build-main-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DDVBSTREAMER5_ENABLE_FFMPEG_AVC=OFF \
            -DDVBSTREAMER5_ENABLE_NVENC=ON \
            -DDVBSTREAMER5_ENABLE_VAAPI=ON \
            -DDVBSTREAMER5_ENABLE_INTEL_QSV=ON

      - name: Compile DVBStreamer5 and mandatory Newcamd plugin
        run: |
          cmake --build build-main-ci --parallel 2 --target DVBStreamer5
          test -x build-main-ci/DVBStreamer5
          test -s build-main-ci/ca-plugins/dvbstreamer5-ca-newcamd.so

      - name: Build and run native MPEG-TS/MP4/failover tests
        run: |
          cmake -S tests/media_core -B build-test-media-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test-media-ci --parallel 2
          ctest --test-dir build-test-media-ci --output-on-failure
          cmake --build build-main-ci --parallel 2 --target \
            dvbstreamer5_audio_track_test \
            dvbstreamer5_video_cadence_test \
            dvbstreamer5_ticker_test \
            dvbstreamer5_docx_import_test
          ctest --test-dir build-main-ci --output-on-failure

      - name: Package portable Linux x86_64 and checksums
        run: |
          version="$(sed -n 's/.*kProgramVersion = "\([^"]*\)";.*/\1/p' src/AppVersion.h)"
          test -n "$version"
          echo "Building version ${version}"
          bash scripts/make_portable_linux_bundle.sh \
            --build-dir build-main-ci \
            --binary build-main-ci/DVBStreamer5 \
            --output-dir "dist/DVBStreamer5-${version}-linux-x86_64" \
            --archive
          sha256sum "dist/DVBStreamer5-${version}-linux-x86_64.tar.gz" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload portable + binary for download
        uses: actions/upload-artifact@v4
        with:
          name: DVBStreamer5-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
            build-main-ci/DVBStreamer5
          if-no-files-found: error
          retention-days: 30
