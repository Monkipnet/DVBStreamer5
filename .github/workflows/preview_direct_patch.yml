name: preview-direct-patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/apply_preview_direct_v10_8_69.py
      - run: git diff --check
      - run: grep -n 'nativePreviewTranscoder' src/StreamManager.h | head -n 3
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/StreamManager.h
          git commit -m 'V10.8.69 use direct V10.8.41 preview pipeline'
          git push origin HEAD:staging/v10.8.69-preview-41
