name: Stage V10.8.50 build

on:
  push:
    branches:
      - stage-v10.8.50-ittiam-streaming
  workflow_dispatch:

jobs:
  release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config \
            libpcsclite-dev libssl-dev ca-certificates curl git \
            binutils nasm autoconf automake libtool

      - name: Vendor locked sources
        run: |
          ./scripts/vendor_srt_source.sh
          ./scripts/vendor_native_codecs.sh

      - name: Build native codecs
        env:
          DVBSTREAMER5_CODEC_JOBS: "2"
        run: ./scripts/build_native_codecs.sh

      - name: Configure Release
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DDVBSTREAMER5_ENABLE_VAAPI=OFF \
            -DDVBSTREAMER5_ENABLE_INTEL_QSV=OFF \
            -DDVBSTREAMER5_ENABLE_NVENC=OFF

      - name: Build DVBStreamer5
        run: cmake --build build-ci --parallel 2 --target DVBStreamer5

      - name: Verify version
        run: ./build-ci/DVBStreamer5 --version || true
