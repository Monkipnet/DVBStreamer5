name: Apply V10.8.125 shared DVB framer fast path

on:
  push:
    branches:
      - v10.8.125-shared-dvb-framer-fastpath

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: ${{ !contains(github.event.head_commit.message, '[v10.8.125-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.125-shared-dvb-framer-fastpath
          fetch-depth: 0

      - name: Apply focused V10.8.125 optimization
        run: python3 tools/apply_v10_8_125_shared_dvb_framer_fastpath.py

      - name: Guard focused diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.125"' src/AppVersion.h
          grep -F 'void pushTrustedAligned(' src/media/TransportStream.h
          grep -F 'void PacketFramer::pushTrustedAligned(' src/media/TransportStream.cpp
          grep -F 'framer_.pushTrustedAligned(data, size, inputPackets_);' src/StreamManager.cpp
          grep -F 'PacketInfo selectedInfo;' src/StreamManager.cpp
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/AppVersion.h src/StreamManager.cpp src/media/TransportStream.cpp src/media/TransportStream.h "
          git diff -- src/media/CbrTsPacer.cpp src/media/SharedDvbInputPool.cpp src/media/MpegTsRemapper.cpp src/media/NativeHlsSegmenter.cpp src/media/NativeUdpRelay.cpp | (! grep .)

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config \
            libpcsclite-dev libssl-dev libcrypt-dev \
            ca-certificates curl binutils nasm autoconf automake libtool

      - name: Vendor locked media dependencies
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          bash scripts/build_native_codecs.sh

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Verify primary artifacts
        run: |
          test -x build/DVBStreamer5
          test -f build/ca-plugins/dvbstreamer5-ca-newcamd.so
          test -x build/oscam-mini/oscam-mini
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppVersion.h src/StreamManager.cpp src/media/TransportStream.cpp src/media/TransportStream.h
          git commit -m 'V10.8.125 skip full parse for foreign shared DVB packets [v10.8.125-applied]'
          git push origin HEAD:v10.8.125-shared-dvb-framer-fastpath
