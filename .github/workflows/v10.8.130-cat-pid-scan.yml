name: Validate V10.8.130 CAT PID scan

on:
  push:
    branches:
      - v10.8.130-cat-pid-scan

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.130-cat-pid-scan
          fetch-depth: 0

      - name: Apply focused optimization
        run: python3 tools/apply_v10_8_130_cat_pid_scan.py

      - name: Guard focused diff
        run: |
          git diff --check
          grep -F 'kProgramVersion = "10.8.130"' src/AppVersion.h
          grep -F 'std::array<std::uint16_t, 682> foundPids;' src/media/MpegTsRemapper.cpp
          ! grep -F 'std::array<bool, 8192> found {};' src/media/MpegTsRemapper.cpp
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/AppVersion.h src/media/MpegTsRemapper.cpp "
          git diff --exit-code HEAD -- src/media/NativeUdpRelay.cpp src/media/CbrTsPacer.cpp src/media/SharedDvbInputPool.cpp src/media/NativeHlsSegmenter.cpp src/media/TransportStream.cpp src/media/TransportStream.h src/StreamManager.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake nodejs pkg-config \
            libpcsclite-dev libssl-dev libcrypt-dev \
            ca-certificates curl binutils nasm autoconf automake libtool

      - name: Vendor locked media dependencies
        run: |
          bash scripts/vendor_srt_source.sh
          bash scripts/vendor_native_codecs.sh
          bash scripts/build_native_codecs.sh

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel 2

      - name: Verify primary artifacts
        run: |
          test -x build/DVBStreamer5
          test -f build/ca-plugins/dvbstreamer5-ca-newcamd.so
          test -x build/oscam-mini/oscam-mini
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'Vitali Lukomski'
          git config user.email 'monkipnet@yandex.ru'
          git add src/AppVersion.h src/media/MpegTsRemapper.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'V10.8.130 avoid full PID-table scans for CAT CA descriptors [v10.8.130-applied]'
            git push origin HEAD:v10.8.130-cat-pid-scan
          fi
