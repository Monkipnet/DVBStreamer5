name: V10.8.68 Newcamd source syntax

on:
  push:
    branches:
      - v10.8.68-csa-verify

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v10.8.68-csa-verify
          fetch-depth: 0

      - name: Install syntax-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libdvbcsa-dev

      - name: Compile NewcamdPlugin.cpp syntax-only
        shell: bash
        run: |
          set +e
          g++ -std=c++17 -fsyntax-only \
            -I src -I third_party -I third_party/boost \
            src/ca/backends/newcamd/NewcamdPlugin.cpp \
            > /tmp/v10868-syntax.log 2>&1
          rc=$?
          {
            echo "SYNTAX_RC=$rc"
            echo "===== COMPILER OUTPUT ====="
            cat /tmp/v10868-syntax.log
          } > V10868_SYNTAX_RESULT.txt
          exit 0

      - name: Save result and remove temporary workflow
        run: |
          rm -f .github/workflows/v10868-syntax.yml
          git config user.name "Monkipnet automation"
          git config user.email "actions@users.noreply.github.com"
          git add V10868_SYNTAX_RESULT.txt .github/workflows/v10868-syntax.yml
          git commit -m "chore: record V10.8.68 syntax validation"
          git push origin HEAD:v10.8.68-csa-verify
